<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coletor de Estrelas</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height:100%;
    background: #070417;
    overflow:hidden;
    touch-action: none;
  }
  body {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #wrap {
    width:100%;
    max-width:380px;
    padding:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  h1 {
    color:#bff7ec;
    font-size:14px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:600;
    opacity:0.85;
  }
  #stage {
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(120,255,220,0.16), 0 20px 60px -20px rgba(0,0,0,0.85);
  }
  canvas {
    display:block;
    width:100%;
    height:auto;
    background:#070417;
  }
  #hud {
    position:absolute;
    top:10px;
    left:0; right:0;
    display:flex;
    flex-direction:column;
    gap:6px;
    pointer-events:none;
  }
  .hud-row {
    display:flex;
    justify-content:space-between;
    padding:0 14px;
    font-family: 'Courier New', monospace;
    font-weight:700;
    font-size:14px;
    color:#d8fff3;
    text-shadow: 0 0 8px rgba(110,231,183,0.5);
  }
  #lives {
    display:flex;
    gap:6px;
    justify-content:center;
  }
  .life-dot {
    width:9px; height:9px; border-radius:50%;
    background:#2dd4bf;
    box-shadow:0 0 7px rgba(45,212,191,0.8);
    transition: opacity .2s;
  }
  .life-dot.lost {
    background:transparent;
    border:1.5px solid rgba(255,255,255,0.25);
    box-shadow:none;
  }
  #overlay {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:rgba(7,4,23,0.4);
    color:#eafffa;
    text-align:center;
    padding:20px;
  }
  #overlay .big {
    font-size:18px;
    font-weight:700;
    letter-spacing:0.03em;
  }
  #overlay .small {
    font-size:12px;
    opacity:0.75;
    font-family: 'Courier New', monospace;
  }
  #hint {
    color:#576079;
    font-size:12px;
    letter-spacing:0.04em;
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>Coletor de Estrelas</h1>
  <div id="stage">
    <canvas id="game" width="320" height="500"></canvas>
    <div id="hud">
      <div class="hud-row">
        <span id="score">000</span>
        <span id="best">MELHOR 000</span>
      </div>
      <div id="lives">
        <div class="life-dot"></div>
        <div class="life-dot"></div>
        <div class="life-dot"></div>
      </div>
    </div>
    <div id="overlay">
      <div class="big">Toque para começar</div>
      <div class="small">arraste para mover · pegue as estrelas, evite os asteroides</div>
    </div>
  </div>
  <div id="hint">arraste o dedo pela tela para guiar a nave</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const lifeDots = document.querySelectorAll('.life-dot');

  const playLeft = 22, playRight = W-22;
  const shipY = H - 66;

  let best = 0;
  let state = 'ready';
  let frame = 0;
  let score = 0;
  let lives = 3;
  let invuln = 0;
  let shake = 0;
  let flash = 0;

  const ship = { x: W/2, targetX: W/2, w: 30, h: 26, dragging:false };
  let items = [];
  let particles = [];

  const nebulae = [
    {cx:0.25, cy:0.28, r:130, color:'99,102,241', speed:0.00021, phase:0},
    {cx:0.75, cy:0.18, r:110, color:'236,72,153', speed:0.00017, phase:2},
    {cx:0.55, cy:0.5,  r:150, color:'45,212,191', speed:0.00013, phase:4}
  ];
  const stars = [];
  for (let i=0;i<55;i++){
    stars.push({x:Math.random(), y:Math.random(), r:Math.random()*1.3+0.3, tw:Math.random()*Math.PI*2});
  }

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function lerp(a,b,t){ return a+(b-a)*t; }

  function resetGame(){
    items = [];
    particles = [];
    score = 0;
    lives = 3;
    invuln = 0;
    frame = 0;
    ship.x = W/2; ship.targetX = W/2;
    scoreEl.textContent = '000';
    updateLives();
  }

  function startGame(){
    resetGame();
    state = 'playing';
    overlay.style.display = 'none';
  }

  function endGame(){
    state = 'over';
    shake = 12;
    flash = 1;
    if (score > best){ best = score; bestEl.textContent = 'MELHOR ' + String(best).padStart(3,'0'); }
    overlay.querySelector('.big').textContent = 'Nave destruída! Pontos: ' + score;
    overlay.querySelector('.small').textContent = 'toque para tentar de novo';
    overlay.style.display = 'flex';
  }

  function updateLives(){
    lifeDots.forEach((d,i)=> d.classList.toggle('lost', i >= lives));
  }

  function canvasXFromClient(clientX){
    const rect = canvas.getBoundingClientRect();
    return clamp((clientX - rect.left) / rect.width * W, playLeft, playRight);
  }

  function onDown(clientX){
    if (state !== 'playing'){ startGame(); return; }
    ship.dragging = true;
    ship.targetX = canvasXFromClient(clientX);
  }
  function onMove(clientX){
    if (!ship.dragging) return;
    ship.targetX = canvasXFromClient(clientX);
  }
  function onUp(){ ship.dragging = false; }

  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); onDown(e.touches[0].clientX); }, {passive:false});
  canvas.addEventListener('touchmove', e=>{ e.preventDefault(); onMove(e.touches[0].clientX); }, {passive:false});
  canvas.addEventListener('touchend', e=>{ e.preventDefault(); onUp(); }, {passive:false});
  canvas.addEventListener('mousedown', e=> onDown(e.clientX));
  window.addEventListener('mousemove', e=> onMove(e.clientX));
  window.addEventListener('mouseup', onUp);
  overlay.addEventListener('touchstart', e=>{ e.preventDefault(); if (state!=='playing') startGame(); }, {passive:false});
  overlay.addEventListener('mousedown', ()=>{ if (state!=='playing') startGame(); });
  document.addEventListener('keydown', e=>{
    if (state!=='playing'){ if (e.code==='Space'){ e.preventDefault(); startGame(); } return; }
    if (e.code==='ArrowLeft') ship.targetX = clamp(ship.targetX-26, playLeft, playRight);
    if (e.code==='ArrowRight') ship.targetX = clamp(ship.targetX+26, playLeft, playRight);
  });

  function spawnItem(){
    const t = frame/60;
    const r = Math.random();
    const x = playLeft + Math.random()*(playRight-playLeft);
    const fallSpeed = 1.7 + t*0.045 + Math.random()*0.6;
    if (r < 0.15){
      const pts = [];
      const n = 7;
      for (let i=0;i<n;i++){
        pts.push(0.65 + Math.random()*0.5);
      }
      items.push({type:'asteroid', x, y:-20, vy:fallSpeed*0.92, r:13, rot:Math.random()*Math.PI*2, rotSpeed:(Math.random()-0.5)*0.06, pts});
    } else if (r < 0.36){
      items.push({type:'star', x, y:-20, vy:fallSpeed, r:11, color:'#ffd76a', glow:'255,215,106', value:3});
    } else {
      items.push({type:'star', x, y:-20, vy:fallSpeed*1.05, r:9, color:'#6ee7f5', glow:'110,231,245', value:1});
    }
  }

  function spawnBurst(x,y,color){
    for (let i=0;i<9;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 1+Math.random()*2.2;
      particles.push({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:22, color});
    }
  }

  let spawnTimer=0, nextSpawn=48;

  function update(){
    frame++;
    ship.x = lerp(ship.x, ship.targetX, 0.28);

    spawnTimer++;
    if (spawnTimer > nextSpawn){
      spawnItem();
      spawnTimer = 0;
      const t = frame/60;
      nextSpawn = Math.max(20, 46 - t*0.9) + Math.random()*18;
    }

    items.forEach(it=>{
      it.y += it.vy;
      if (it.type==='asteroid') it.rot += it.rotSpeed;
    });

    if (invuln>0) invuln--;

    const shipCX = ship.x, shipCY = shipY;
    const shipR = 14;

    items.forEach(it=>{
      if (it.dead) return;
      const dx = it.x-shipCX, dy = it.y-shipCY;
      const dist = Math.sqrt(dx*dx+dy*dy);
      if (dist < shipR + it.r){
        if (it.type==='star'){
          score += it.value;
          scoreEl.textContent = String(score).padStart(3,'0');
          spawnBurst(it.x, it.y, it.glow);
          it.dead = true;
        } else if (invuln<=0){
          lives--;
          updateLives();
          invuln = 75;
          shake = 9;
          flash = 1;
          spawnBurst(it.x, it.y, '255,120,90');
          it.dead = true;
          if (lives<=0) endGame();
        }
      }
    });

    items = items.filter(it => !it.dead && it.y < H+30);

    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--; });
    particles = particles.filter(p=>p.life>0);

    if (shake>0) shake -= 0.7;
    if (flash>0) flash -= 0.05;
  }

  function drawBackground(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#070417');
    g.addColorStop(1,'#160b30');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    nebulae.forEach(n=>{
      const cx = (n.cx + Math.sin(frame*n.speed+n.phase)*0.06)*W;
      const cy = (n.cy + Math.cos(frame*n.speed*0.8+n.phase)*0.05)*H;
      const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,n.r);
      grad.addColorStop(0, `rgba(${n.color},0.16)`);
      grad.addColorStop(1, `rgba(${n.color},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx,cy,n.r,0,Math.PI*2); ctx.fill();
    });

    stars.forEach(s=>{
      const a = 0.3 + Math.sin(frame*0.025+s.tw)*0.3;
      ctx.fillStyle = `rgba(220,230,255,${Math.max(0,a)})`;
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2); ctx.fill();
    });
  }

  function drawStarShape(x,y,r,color,glow){
    ctx.save();
    ctx.translate(x,y);
    ctx.shadowColor = `rgba(${glow},0.9)`;
    ctx.shadowBlur = 10;
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i=0;i<8;i++){
      const ang = (Math.PI/4)*i;
      const rad = i%2===0 ? r : r*0.42;
      const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawAsteroid(it){
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.rot);
    ctx.fillStyle = '#3d3444';
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const n = it.pts.length;
    for (let i=0;i<n;i++){
      const ang = (Math.PI*2/n)*i;
      const rad = it.r*it.pts[i];
      const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.arc(-it.r*0.2,-it.r*0.1,it.r*0.22,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(it.r*0.25,it.r*0.2,it.r*0.16,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawShip(){
    if (invuln>0 && Math.floor(invuln/5)%2===0) return;
    ctx.save();
    ctx.translate(ship.x, shipY);

    const flicker = 8 + Math.random()*6;
    const flameGrad = ctx.createLinearGradient(0,14,0,14+flicker);
    flameGrad.addColorStop(0,'rgba(255,200,120,0.9)');
    flameGrad.addColorStop(1,'rgba(255,200,120,0)');
    ctx.fillStyle = flameGrad;
    ctx.beginPath();
    ctx.moveTo(-6,14); ctx.lineTo(6,14); ctx.lineTo(0,14+flicker);
    ctx.closePath(); ctx.fill();

    ctx.shadowColor = 'rgba(45,212,191,0.7)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#0c0c18';
    ctx.beginPath();
    ctx.moveTo(0,-16);
    ctx.lineTo(11,14);
    ctx.lineTo(4,10);
    ctx.lineTo(-4,10);
    ctx.lineTo(-11,14);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#2dd4bf';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#bff7ec';
    ctx.beginPath();
    ctx.arc(0,-3,3.4,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  function render(){
    ctx.save();
    if (shake>0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    ctx.clearRect(-20,-20,W+40,H+40);
    drawBackground();

    items.forEach(it=>{
      if (it.type==='star') drawStarShape(it.x,it.y,it.r,it.color,it.glow);
      else drawAsteroid(it);
    });

    particles.forEach(p=>{
      ctx.fillStyle = `rgba(${p.color},${Math.max(0,p.life/22)})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.2,0,Math.PI*2); ctx.fill();
    });

    drawShip();

    if (flash>0){
      ctx.fillStyle = `rgba(255,90,90,${flash*0.3})`;
      ctx.fillRect(0,0,W,H);
    }
    ctx.restore();
  }

  function loop(){
    if (state==='playing') update();
    render();
    requestAnimationFrame(loop);
  }

  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
