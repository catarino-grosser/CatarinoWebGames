<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cometa Caçador</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body {
    height:100%;
    background: #05050c;
    overflow:hidden;
    touch-action: none;
  }
  body {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #wrap {
    width:100%;
    max-width:400px;
    padding:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  h1 {
    color:#ffe4cc;
    font-size:14px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:600;
    opacity:0.85;
  }
  #stage {
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(251,146,60,0.2), 0 20px 60px -20px rgba(0,0,0,0.85);
  }
  canvas {
    display:block;
    width:100%;
    height:auto;
    background:#05050c;
  }
  #hud {
    position:absolute;
    top:10px;
    left:0; right:0;
    display:flex;
    flex-direction:column;
    gap:6px;
    pointer-events:none;
  }
  .hud-row {
    display:flex;
    justify-content:space-between;
    padding:0 14px;
    font-family:'Courier New', monospace;
    font-weight:700;
    font-size:14px;
    color:#ffe9d6;
    text-shadow:0 0 8px rgba(251,146,60,0.55);
  }
  #hearts { display:flex; gap:5px; justify-content:center; }
  .heart {
    width:10px; height:10px; border-radius:50% 50% 50% 0;
    transform:rotate(45deg);
    background:#fb7185;
    box-shadow:0 0 6px rgba(251,113,133,0.8);
  }
  .heart.lost { background:transparent; border:1.5px solid rgba(255,255,255,0.22); box-shadow:none; }
  #overlay {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:rgba(5,5,12,0.5);
    color:#fff3e8;
    text-align:center;
    padding:24px;
  }
  #overlay .big { font-size:18px; font-weight:700; letter-spacing:0.03em; }
  #overlay .small { font-size:12px; opacity:0.75; font-family:'Courier New', monospace; max-width:270px; }
  #hint { color:#524438; font-size:12px; letter-spacing:0.04em; text-align:center; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Cometa Caçador</h1>
  <div id="stage">
    <canvas id="game" width="380" height="520"></canvas>
    <div id="hud">
      <div class="hud-row">
        <span id="score">000</span>
        <span id="best">MELHOR 000</span>
      </div>
      <div id="hearts">
        <div class="heart"></div><div class="heart"></div><div class="heart"></div>
        <div class="heart"></div><div class="heart"></div>
      </div>
    </div>
    <div id="overlay">
      <div class="big">Cometa Caçador</div>
      <div class="small">arraste para trás perto da base e solte para lançar o cometa nos meteoros</div>
    </div>
  </div>
  <div id="hint">arraste e solte para atirar</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const hearts = document.querySelectorAll('.heart');

  const launch = { x: W/2, y: H-32 };
  const maxPull = 115;
  const maxVel = 15.5;
  const GRAVITY = 0.32;

  let best = 0;
  let gameState = 'start'; // start | playing | over
  let frame = 0;
  let score = 0;
  let hp = 5;
  let shake = 0, flash = 0;

  let aiming = false;
  let dragPos = null;
  let comet = null;
  let reload = 0;

  let targets = [];
  let particles = [];
  const stars = [];
  for (let i=0;i<60;i++){
    stars.push({x:Math.random(), y:Math.random()*0.85, r:Math.random()*1.3+0.3, tw:Math.random()*Math.PI*2});
  }

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function pad(n){ return String(n).padStart(3,'0'); }
  function updateHearts(){ hearts.forEach((h,i)=> h.classList.toggle('lost', i>=hp)); }

  let spawnTimer=0, nextSpawn=50;

  function resetGame(){
    score=0; hp=5; frame=0; targets=[]; particles=[]; comet=null; aiming=false; reload=0;
    spawnTimer=0; nextSpawn=50;
    scoreEl.textContent='000';
    updateHearts();
  }
  function startGame(){ resetGame(); gameState='playing'; overlay.style.display='none'; }
  function endGame(){
    gameState='over'; shake=12; flash=0.8;
    if (score>best){ best=score; bestEl.textContent='MELHOR '+pad(best); }
    overlay.querySelector('.big').textContent = 'Os meteoros escaparam!';
    overlay.querySelector('.small').textContent = 'pontos: '+score+' · toque para tentar de novo';
    overlay.style.display='flex';
  }

  overlay.addEventListener('touchstart', e=>{ e.preventDefault(); tapStart(); }, {passive:false});
  overlay.addEventListener('mousedown', tapStart);
  function tapStart(){ if (gameState==='start'||gameState==='over') startGame(); }

  function canvasPos(clientX,clientY){
    const rect = canvas.getBoundingClientRect();
    return { x:(clientX-rect.left)/rect.width*W, y:(clientY-rect.top)/rect.height*H };
  }

  function beginAim(x,y){
    if (gameState!=='playing' || comet || reload>0) return;
    aiming = true;
    dragPos = {x,y};
  }
  function moveAim(x,y){
    if (!aiming) return;
    dragPos = {x,y};
  }
  function endAim(){
    if (!aiming){ return; }
    aiming = false;
    const pull = clampedPull();
    const dist = Math.hypot(pull.x,pull.y);
    if (dist > 14){
      const vx = -pull.x/maxPull*maxVel;
      const vy = -pull.y/maxPull*maxVel;
      comet = { x:launch.x, y:launch.y, vx, vy, trail:[], life:220 };
    }
    dragPos = null;
  }

  function clampedPull(){
    if (!dragPos) return {x:0,y:0};
    let dx = dragPos.x-launch.x, dy = dragPos.y-launch.y;
    const d = Math.hypot(dx,dy);
    if (d>maxPull){ dx = dx/d*maxPull; dy = dy/d*maxPull; }
    return {x:dx,y:dy};
  }

  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.touches[0]; const p=canvasPos(t.clientX,t.clientY); beginAim(p.x,p.y); }, {passive:false});
  canvas.addEventListener('touchmove', e=>{ e.preventDefault(); const t=e.touches[0]; const p=canvasPos(t.clientX,t.clientY); moveAim(p.x,p.y); }, {passive:false});
  canvas.addEventListener('touchend', e=>{ e.preventDefault(); endAim(); }, {passive:false});
  canvas.addEventListener('mousedown', e=>{ const p=canvasPos(e.clientX,e.clientY); beginAim(p.x,p.y); });
  window.addEventListener('mousemove', e=>{ if (aiming){ const p=canvasPos(e.clientX,e.clientY); moveAim(p.x,p.y); } });
  window.addEventListener('mouseup', ()=>{ if (aiming) endAim(); });

  function spawnBurst(x,y,color,n){
    for (let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=0.8+Math.random()*2.4;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:24,color});
    }
  }

  function spawnTarget(){
    const rare = Math.random()<0.3;
    const x = 40+Math.random()*(W-80);
    const y = 50+Math.random()*(H*0.5);
    if (rare){
      targets.push({x,y,baseY:y,r:11,value:3,life:220,maxLife:220,vx:(Math.random()-0.5)*0.6,bob:Math.random()*Math.PI*2,type:'fugaz'});
    } else {
      targets.push({x,y,baseY:y,r:16,value:1,life:380,maxLife:380,vx:(Math.random()-0.5)*0.35,bob:Math.random()*Math.PI*2,type:'meteoro'});
    }
  }

  function update(){
    frame++;
    if (reload>0) reload--;

    spawnTimer++;
    if (spawnTimer>nextSpawn && targets.length<5){
      spawnTarget();
      spawnTimer=0;
      nextSpawn = 60+Math.random()*40;
    }

    targets.forEach(t=>{
      t.bob += 0.03;
      t.x += t.vx;
      if (t.x<30||t.x>W-30) t.vx*=-1;
      t.y = t.baseY + Math.sin(t.bob)*8;
      t.life--;
    });
    const expired = targets.filter(t=>t.life<=0);
    if (expired.length){
      hp -= expired.length;
      updateHearts();
      shake=6; flash=0.4;
      expired.forEach(t=> spawnBurst(t.x,t.y,'150,150,160',6));
      if (hp<=0){ targets = targets.filter(t=>t.life>0); endGame(); return; }
    }
    targets = targets.filter(t=>t.life>0);

    if (comet){
      comet.vy += GRAVITY;
      comet.x += comet.vx;
      comet.y += comet.vy;
      comet.life--;
      comet.trail.push({x:comet.x,y:comet.y,life:18});
      comet.trail.forEach(p=>p.life--);
      comet.trail = comet.trail.filter(p=>p.life>0);

      let hitIdx = -1;
      for (let i=0;i<targets.length;i++){
        const t = targets[i];
        if (Math.hypot(comet.x-t.x, comet.y-t.y) < t.r+7){ hitIdx=i; break; }
      }
      if (hitIdx>=0){
        const t = targets[hitIdx];
        score += t.value;
        scoreEl.textContent = pad(score);
        spawnBurst(t.x,t.y, t.type==='fugaz' ? '255,215,106' : '125,211,252', 14);
        targets.splice(hitIdx,1);
        comet = null;
        reload = 10;
      } else if (comet.x<-30||comet.x>W+30||comet.y>H+30||comet.life<=0){
        comet = null;
        reload = 10;
      }
    }

    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--; });
    particles = particles.filter(p=>p.life>0);

    if (shake>0) shake-=0.6;
    if (flash>0) flash-=0.05;
  }

  function drawBackground(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0c0a1a');
    g.addColorStop(0.6,'#08060f');
    g.addColorStop(1,'#05050c');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    stars.forEach(s=>{
      const a = 0.3+Math.sin(frame*0.02+s.tw)*0.3;
      ctx.fillStyle = `rgba(255,240,220,${Math.max(0,a)})`;
      ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2); ctx.fill();
    });
  }

  function drawLaunchRig(){
    ctx.save();
    ctx.translate(launch.x,launch.y);
    ctx.strokeStyle = 'rgba(251,146,60,0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-16,18); ctx.lineTo(-6,-16);
    ctx.moveTo(16,18); ctx.lineTo(6,-16);
    ctx.stroke();
    ctx.restore();
  }

  function drawAim(){
    if (!aiming || !dragPos) return;
    const pull = clampedPull();
    const px = launch.x+pull.x, py = launch.y+pull.y;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,214,170,0.5)';
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(launch.x-6,launch.y-14); ctx.lineTo(px,py); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(launch.x+6,launch.y-14); ctx.lineTo(px,py); ctx.stroke();
    ctx.shadowColor = '#fb923c'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#ffd9b3';
    ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2); ctx.fill();
    ctx.restore();

    let sx=launch.x, sy=launch.y;
    let vx = -pull.x/maxPull*maxVel, vy = -pull.y/maxPull*maxVel;
    ctx.fillStyle = 'rgba(255,214,170,0.55)';
    for (let i=0;i<26;i++){
      vy += GRAVITY;
      sx += vx; sy += vy;
      if (sx<0||sx>W||sy>H) break;
      if (i%2===0){ ctx.beginPath(); ctx.arc(sx,sy,2,0,Math.PI*2); ctx.fill(); }
    }
  }

  function drawTarget(t){
    const warn = t.life < t.maxLife*0.25;
    const flick = warn ? (Math.floor(frame/6)%2===0) : true;
    ctx.save();
    if (flick){
      const color = t.type==='fugaz' ? '255,215,106' : '125,211,252';
      ctx.shadowColor = `rgba(${color},0.9)`;
      ctx.shadowBlur = 12;
      ctx.fillStyle = t.type==='fugaz' ? '#3a2a10' : '#0f2233';
      ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = `rgba(${color},0.8)`;
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    const frac = t.life/t.maxLife;
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(t.x,t.y,t.r+5,-Math.PI/2,-Math.PI/2+Math.PI*2*frac);
    ctx.stroke();
    ctx.restore();
  }

  function drawComet(){
    if (!comet) return;
    comet.trail.forEach(p=>{
      ctx.fillStyle = `rgba(255,150,80,${Math.max(0,p.life/18*0.5)})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill();
    });
    ctx.save();
    ctx.shadowColor = 'rgba(255,200,140,0.9)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#fff3e0';
    ctx.beginPath(); ctx.arc(comet.x,comet.y,6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function render(){
    ctx.save();
    if (shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    ctx.clearRect(-20,-20,W+40,H+40);
    drawBackground();
    drawLaunchRig();
    targets.forEach(drawTarget);
    drawComet();
    drawAim();

    particles.forEach(p=>{
      ctx.fillStyle = `rgba(${p.color},${Math.max(0,p.life/24)})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,2,0,Math.PI*2); ctx.fill();
    });

    if (flash>0){
      ctx.fillStyle = `rgba(255,90,90,${flash*0.3})`;
      ctx.fillRect(0,0,W,H);
    }
    ctx.restore();
  }

  function loop(){
    if (gameState==='playing') update();
    render();
    requestAnimationFrame(loop);
  }

  render();
  loop();
})();
</script>
</body>
</html>
