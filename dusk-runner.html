<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Corredor do Crepúsculo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height:100%;
    background: #0b0617;
    overflow:hidden;
    touch-action: manipulation;
  }
  body {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #wrap {
    width:100%;
    max-width:480px;
    padding:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  h1 {
    color:#ffd9b3;
    font-size:15px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:600;
    opacity:0.85;
  }
  #stage {
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(255,180,84,0.18), 0 20px 60px -20px rgba(0,0,0,0.8);
  }
  canvas {
    display:block;
    width:100%;
    height:auto;
    background:#0b0617;
  }
  #hud {
    position:absolute;
    top:10px;
    left:0; right:0;
    display:flex;
    justify-content:space-between;
    padding:0 14px;
    font-family: 'Courier New', monospace;
    font-weight:700;
    font-size:15px;
    color:#ffe9c7;
    text-shadow: 0 0 8px rgba(255,180,84,0.5);
    pointer-events:none;
  }
  #overlay {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:rgba(11,6,23,0.35);
    color:#ffe9c7;
    text-align:center;
    padding:20px;
  }
  #overlay .big {
    font-size:19px;
    font-weight:700;
    letter-spacing:0.03em;
  }
  #overlay .small {
    font-size:13px;
    opacity:0.75;
    font-family: 'Courier New', monospace;
  }
  #hint {
    color:#7c6f92;
    font-size:12px;
    letter-spacing:0.04em;
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>Corredor do Crepúsculo</h1>
  <div id="stage">
    <canvas id="game" width="400" height="220"></canvas>
    <div id="hud">
      <span id="score">000</span>
      <span id="best">MELHOR 000</span>
    </div>
    <div id="overlay">
      <div class="big">Toque para começar</div>
      <div class="small">pule sobre as pedras</div>
    </div>
  </div>
  <div id="hint">toque na tela · barra de espaço no computador</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const groundY = H - 34;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');

  let best = 0;

  const player = {
    x: 54, y: groundY - 40, w: 26, h: 40,
    vy: 0, jumping: false, legPhase: 0,
    trail: []
  };

  const GRAVITY = 0.62;
  const JUMP_V = -11.6;

  let obstacles = [];
  let particles = []; // dust / stars
  let speed = 4.6;
  let baseSpeed = 4.6;
  let spawnTimer = 0;
  let nextSpawn = 70;
  let distance = 0;
  let state = 'ready'; // ready | playing | over
  let frame = 0;
  let moonAngle = 0;

  // background stars, fixed field
  const stars = [];
  for (let i=0;i<40;i++){
    stars.push({x: Math.random()*W, y: Math.random()*(groundY-20), r: Math.random()*1.4+0.3, tw: Math.random()*Math.PI*2});
  }

  function resetGame(){
    obstacles = [];
    particles = [];
    speed = baseSpeed;
    spawnTimer = 0;
    nextSpawn = 70;
    distance = 0;
    frame = 0;
    player.y = groundY - player.h;
    player.vy = 0;
    player.jumping = false;
    player.trail = [];
    scoreEl.textContent = '000';
  }

  function startGame(){
    resetGame();
    state = 'playing';
    overlay.style.display = 'none';
  }

  function endGame(){
    state = 'over';
    const s = Math.floor(distance/10);
    if (s > best){ best = s; bestEl.textContent = 'MELHOR ' + String(best).padStart(3,'0'); }
    overlay.querySelector('.big').textContent = 'Você bateu! Pontos: ' + s;
    overlay.querySelector('.small').textContent = 'toque para tentar de novo';
    overlay.style.display = 'flex';
  }

  function doJump(){
    if (state === 'ready'){ startGame(); return; }
    if (state === 'over'){ startGame(); return; }
    if (state === 'playing' && !player.jumping){
      player.vy = JUMP_V;
      player.jumping = true;
    }
  }

  canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); doJump(); }, {passive:false});
  canvas.addEventListener('mousedown', doJump);
  overlay.addEventListener('touchstart', (e)=>{ e.preventDefault(); doJump(); }, {passive:false});
  overlay.addEventListener('mousedown', doJump);
  document.addEventListener('keydown', (e)=>{
    if (e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); doJump(); }
  });

  function spawnObstacle(){
    const h = 26 + Math.random()*30;
    const w = 14 + Math.random()*14;
    const cluster = Math.random() < 0.18;
    obstacles.push({x: W + 10, y: groundY - h, w, h, jag: Math.random()});
    if (cluster){
      obstacles.push({x: W + 10 + w + 16, y: groundY - (h*0.7), w: w*0.8, h: h*0.7, jag: Math.random()});
    }
  }

  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function update(){
    frame++;
    distance += speed;
    speed = baseSpeed + distance/2200;

    // player physics
    player.vy += GRAVITY;
    player.y += player.vy;
    if (player.y >= groundY - player.h){
      player.y = groundY - player.h;
      if (player.jumping){
        // landing dust
        for (let i=0;i<6;i++){
          particles.push({x: player.x+player.w/2, y: groundY, vx:(Math.random()-0.5)*2.2, vy:-Math.random()*1.6, life:20, type:'dust'});
        }
      }
      player.vy = 0;
      player.jumping = false;
    }

    if (player.jumping){
      player.trail.push({x: player.x+4, y: player.y+player.h/2, life:14});
    }
    player.trail.forEach(t=>t.life--);
    player.trail = player.trail.filter(t=>t.life>0);

    player.legPhase += player.jumping ? 0 : speed*0.09;

    // obstacles
    spawnTimer++;
    if (spawnTimer > nextSpawn){
      spawnObstacle();
      spawnTimer = 0;
      nextSpawn = Math.max(38, 70 - distance/300) + Math.random()*30;
    }
    obstacles.forEach(o=> o.x -= speed);
    obstacles = obstacles.filter(o=> o.x + o.w > -10);

    const pBox = {x: player.x+6, y: player.y+4, w: player.w-12, h: player.h-6};
    for (const o of obstacles){
      if (rectsOverlap(pBox, o)){ endGame(); break; }
    }

    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life--; });
    particles = particles.filter(p=>p.life>0);

    moonAngle += 0.0006;
    const s = Math.floor(distance/10);
    scoreEl.textContent = String(s).padStart(3,'0');
  }

  function drawSky(){
    const g = ctx.createLinearGradient(0,0,0,groundY);
    g.addColorStop(0, '#0b0617');
    g.addColorStop(0.55, '#2a1246');
    g.addColorStop(1, '#5c2350');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,groundY);

    // stars
    stars.forEach(st=>{
      const alpha = 0.4 + Math.sin(frame*0.03 + st.tw)*0.3;
      ctx.fillStyle = `rgba(255,233,199,${Math.max(0,alpha)})`;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
      ctx.fill();
    });

    // moon
    const mx = W*0.78, my = 46;
    const glow = ctx.createRadialGradient(mx,my,2,mx,my,40);
    glow.addColorStop(0,'rgba(255,196,120,0.55)');
    glow.addColorStop(1,'rgba(255,196,120,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(mx,my,40,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffe4b0';
    ctx.beginPath(); ctx.arc(mx,my,13,0,Math.PI*2); ctx.fill();

    // distant dunes (parallax)
    ctx.fillStyle = 'rgba(20,10,35,0.7)';
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    const off1 = (distance*0.15) % W;
    for (let x=-off1; x<W+40; x+=80){
      ctx.quadraticCurveTo(x+40, groundY-26, x+80, groundY);
    }
    ctx.lineTo(W, groundY); ctx.lineTo(0,groundY); ctx.fill();
  }

  function drawGround(){
    ctx.fillStyle = '#1b0e2e';
    ctx.fillRect(0, groundY, W, H-groundY);
    ctx.strokeStyle = 'rgba(255,180,84,0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();

    // scrolling ground ticks
    ctx.fillStyle = 'rgba(255,180,84,0.25)';
    const off = distance % 26;
    for (let x = -off; x < W; x += 26){
      ctx.fillRect(x, groundY+8, 12, 2);
    }
  }

  function drawPlayer(){
    // trail glow
    player.trail.forEach(t=>{
      ctx.fillStyle = `rgba(255,159,91,${t.life/14*0.35})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, 8*(t.life/14), 0, Math.PI*2);
      ctx.fill();
    });

    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.fillStyle = '#150a24';
    // body
    ctx.beginPath();
    ctx.roundRect(4, 0, player.w-8, player.h-14, 6);
    ctx.fill();
    // head
    ctx.beginPath();
    ctx.arc(player.w/2, -2, 8, 0, Math.PI*2);
    ctx.fill();
    // legs
    const legOffset = player.jumping ? 6 : Math.sin(player.legPhase)*7;
    ctx.strokeStyle = '#150a24';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(player.w*0.4, player.h-14);
    ctx.lineTo(player.w*0.4 + legOffset*0.5, player.h-1);
    ctx.moveTo(player.w*0.6, player.h-14);
    ctx.lineTo(player.w*0.6 - legOffset*0.5, player.h-1);
    ctx.stroke();
    // amber rim light
    ctx.strokeStyle = 'rgba(255,180,84,0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(4, 0, player.w-8, player.h-14, 6);
    ctx.stroke();
    ctx.restore();
  }

  function drawObstacles(){
    obstacles.forEach(o=>{
      ctx.fillStyle = '#1a0f1f';
      ctx.beginPath();
      ctx.moveTo(o.x, o.y+o.h);
      ctx.lineTo(o.x + o.w*0.15, o.y + o.h*(0.15+o.jag*0.2));
      ctx.lineTo(o.x + o.w*0.5, o.y);
      ctx.lineTo(o.x + o.w*0.85, o.y + o.h*(0.1+o.jag*0.25));
      ctx.lineTo(o.x + o.w, o.y+o.h);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,180,84,0.35)';
      ctx.lineWidth = 1;
      ctx.stroke();
    });
  }

  function drawParticles(){
    particles.forEach(p=>{
      ctx.fillStyle = `rgba(255,224,180,${Math.max(0,p.life/20*0.6)})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
      ctx.fill();
    });
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    drawSky();
    drawGround();
    drawObstacles();
    drawPlayer();
    drawParticles();
  }

  function loop(){
    if (state === 'playing') update();
    render();
    requestAnimationFrame(loop);
  }

  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
