<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A Brasa Perdida</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body {
    height:100%;
    background: #050807;
    overflow:hidden;
    touch-action: none;
  }
  body {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #wrap {
    width:100%;
    max-width:380px;
    padding:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  h1 {
    color:#ffe3ad;
    font-size:14px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:600;
    opacity:0.9;
  }
  #stage {
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(255,207,107,0.2), 0 20px 60px -20px rgba(0,0,0,0.85);
  }
  canvas {
    display:block;
    width:100%;
    height:auto;
    background:#0a1410;
  }

  #hud {
    position:absolute;
    top:10px; left:0; right:0;
    display:flex;
    flex-direction:column;
    gap:5px;
    pointer-events:none;
  }
  .hud-row {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
  }
  #hearts { display:flex; gap:4px; }
  .heart {
    width:12px; height:12px; border-radius:3px;
    background:#ffcf6b;
    box-shadow:0 0 6px rgba(255,207,107,0.8);
    transform:rotate(45deg);
  }
  .heart.lost { background:transparent; border:1.5px solid rgba(255,255,255,0.22); box-shadow:none; }
  #itemIcon {
    width:16px; height:16px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.25);
    background:transparent;
  }
  #itemIcon.lit {
    background:#ffcf6b;
    box-shadow:0 0 8px rgba(255,207,107,0.9);
    border-color:#ffcf6b;
  }
  #questText {
    text-align:center;
    font-size:11px;
    color:#d9e8dd;
    background:rgba(5,10,8,0.55);
    padding:4px 10px;
    border-radius:999px;
    margin:0 auto;
    font-family:'Courier New', monospace;
    letter-spacing:0.02em;
  }

  #dialogueBox {
    position:absolute;
    left:10px; right:10px; bottom:14px;
    background:rgba(6,12,9,0.92);
    border:1px solid rgba(255,207,107,0.4);
    border-radius:12px;
    padding:12px 14px;
    display:none;
    flex-direction:column;
    gap:4px;
    z-index:5;
  }
  #dialogueBox .name {
    font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:#ffcf6b; font-weight:700;
  }
  #dialogueBox .text {
    font-size:13px; line-height:1.42; color:#f0fff2;
    min-height:34px;
  }
  #dialogueBox .hint {
    align-self:flex-end;
    font-size:10px; color:rgba(255,255,255,0.4);
    font-family:'Courier New', monospace;
  }

  #controls { position:absolute; inset:0; pointer-events:none; }
  #joyBase {
    position:absolute; left:14px; bottom:14px;
    width:78px; height:78px; border-radius:50%;
    background:rgba(255,255,255,0.05);
    border:1.5px solid rgba(255,207,107,0.32);
    pointer-events:auto;
  }
  #joyKnob {
    position:absolute; left:50%; top:50%; width:30px; height:30px;
    margin-left:-15px; margin-top:-15px;
    border-radius:50%;
    background:rgba(255,207,107,0.55);
    box-shadow:0 0 10px rgba(255,207,107,0.5);
  }
  #interactBtn, #attackBtn {
    position:absolute;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto;
    font-size:20px;
    transition: box-shadow .15s, border-color .15s, color .15s, transform .1s;
  }
  #interactBtn {
    right:18px; bottom:82px;
    width:44px; height:44px;
    background:rgba(255,255,255,0.05);
    border:1.5px solid rgba(255,255,255,0.18);
    color:rgba(255,255,255,0.45);
  }
  #interactBtn.active {
    border-color:#8fe9c9;
    color:#8fe9c9;
    box-shadow:0 0 12px rgba(143,233,201,0.55);
  }
  #attackBtn {
    right:14px; bottom:14px;
    width:60px; height:60px;
    background:rgba(255,207,107,0.14);
    border:2px solid rgba(255,207,107,0.6);
    color:#ffcf6b;
    box-shadow:0 0 14px rgba(255,207,107,0.25);
  }
  #attackBtn:active, #interactBtn:active { transform:scale(0.9); }

  #overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px;
    background:rgba(5,8,7,0.45);
    color:#f0fff2;
    text-align:center;
    padding:24px;
    z-index:6;
  }
  #overlay .big { font-size:18px; font-weight:700; letter-spacing:0.02em; }
  #overlay .small { font-size:12px; opacity:0.75; font-family:'Courier New', monospace; line-height:1.5; }

  #hint {
    color:#4c5a51;
    font-size:11.5px;
    letter-spacing:0.03em;
    text-align:center;
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>A Brasa Perdida</h1>
  <div id="stage">
    <canvas id="game" width="320" height="460"></canvas>

    <div id="hud">
      <div class="hud-row">
        <div id="hearts"></div>
        <div id="itemIcon"></div>
      </div>
      <div id="questText">Toque para começar</div>
    </div>

    <div id="dialogueBox">
      <div class="name" id="dlgName">Guardião</div>
      <div class="text" id="dlgText"></div>
      <div class="hint">toque para continuar ▸</div>
    </div>

    <div id="controls">
      <div id="joyBase"><div id="joyKnob"></div></div>
      <div id="interactBtn">✋</div>
      <div id="attackBtn">⚔</div>
    </div>

    <div id="overlay">
      <div class="big">A Brasa Perdida</div>
      <div class="small">as sombras tomaram o bosque.<br>toque para começar sua jornada</div>
    </div>
  </div>
  <div id="hint">arraste para mover · ✋ interage · ⚔ ataca · WASD/setas, E, espaço no computador</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const TILE = 32, COLS = 20, ROWS = 18;
  const WORLD_W = COLS*TILE, WORLD_H = ROWS*TILE;

  const heartsEl = document.getElementById('hearts');
  const itemIconEl = document.getElementById('itemIcon');
  const questTextEl = document.getElementById('questText');
  const dialogueBox = document.getElementById('dialogueBox');
  const dlgName = document.getElementById('dlgName');
  const dlgText = document.getElementById('dlgText');
  const controls = document.getElementById('controls');
  const overlay = document.getElementById('overlay');
  const joyBase = document.getElementById('joyBase');
  const joyKnob = document.getElementById('joyKnob');
  const interactBtn = document.getElementById('interactBtn');
  const attackBtn = document.getElementById('attackBtn');

  // ---------- map ----------
  const mapGrid = [];
  for (let r=0;r<ROWS;r++){
    const row = [];
    for (let c=0;c<COLS;c++){
      row.push((r===0||r===ROWS-1||c===0||c===COLS-1) ? '#' : '.');
    }
    mapGrid.push(row);
  }
  function block(r0,r1,c0,c1,ch){ for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) mapGrid[r][c]=ch; }
  block(2,3,3,4,'#');
  block(2,3,13,14,'#');
  block(6,7,2,3,'o');
  block(8,10,8,11,'~');
  block(11,12,15,16,'#');
  block(14,15,2,3,'#');
  mapGrid[4][9] = '#';
  mapGrid[12][5] = 'o';
  mapGrid[13][12] = '#';
  mapGrid[15][17] = 'o';

  function tileAt(px,py){
    const c = Math.floor(px/TILE), r = Math.floor(py/TILE);
    if (r<0||r>=ROWS||c<0||c>=COLS) return '#';
    return mapGrid[r][c];
  }
  function tileBlocked(px,py){
    const t = tileAt(px,py);
    return t==='#'||t==='o'||t==='~';
  }

  function tileToPx(c,r){ return { x:c*TILE+TILE/2, y:r*TILE+TILE/2 }; }

  // ---------- helpers ----------
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function normalize(dx,dy){ const d=Math.hypot(dx,dy); if (d<0.0001) return {x:0,y:0}; return {x:dx/d,y:dy/d}; }
  function facingVector(f){
    if (f==='left') return {x:-1,y:0};
    if (f==='right') return {x:1,y:0};
    if (f==='up') return {x:0,y:-1};
    return {x:0,y:1};
  }
  function pad3(n){ return String(n).padStart(3,'0'); }

  // ---------- entities ----------
  const playerStart = tileToPx(2,8);
  const npcPos = tileToPx(4,6);
  const chestPos = tileToPx(10,5);
  const shrinePos = tileToPx(17,13);
  const enemyTiles = [[7,5],[13,7],[6,11],[14,10],[9,14]];

  let player, playerKB, npc, chest, shrine, enemies, particles, floaters, fireflies;
  let camera = {x:0,y:0};
  let gameState = 'ready'; // ready | playing | dialogue | gameover | victory
  let quest = 'intro'; // intro | active | ember | complete
  let defeated = 0;
  let shake = 0, flash = 0;
  let victoryTimer = 0;
  let dialogueQueue = [], dialogueIndex = 0, dialogueOnDone = null;

  function initWorld(){
    player = { x:playerStart.x, y:playerStart.y, r:12, hp:5, maxHp:5, invuln:0, atkCd:0, swingTimer:0, facing:'down', moving:false };
    playerKB = {x:0,y:0};
    npc = { x:npcPos.x, y:npcPos.y, r:13 };
    chest = { x:chestPos.x, y:chestPos.y, r:14, opened:false, lidT:0 };
    shrine = { x:shrinePos.x, y:shrinePos.y, r:16, activated:false };
    enemies = enemyTiles.map(([c,r])=>{
      const p = tileToPx(c,r);
      return { x:p.x, y:p.y, homeX:p.x, homeY:p.y, r:11, hp:2, maxHp:2, dead:false, deathTimer:0,
        mode:'wander', wanderTarget:{x:p.x,y:p.y}, wanderTimer:60+Math.random()*60,
        kb:{x:0,y:0}, flash:0, facing:'down', bob:Math.random()*Math.PI*2 };
    });
    particles = [];
    floaters = [];
    fireflies = [];
    for (let i=0;i<16;i++){
      fireflies.push({ x:Math.random()*WORLD_W, y:Math.random()*WORLD_H, phase:Math.random()*Math.PI*2, speed:0.3+Math.random()*0.4 });
    }
    camera.x = clamp(player.x-W/2, 0, WORLD_W-W);
    camera.y = clamp(player.y-H/2, 0, WORLD_H-H);
    quest = 'intro';
    defeated = 0;
    shake = 0; flash = 0; victoryTimer = 0;
    updateHearts();
    itemIconEl.classList.remove('lit');
    updateQuestText();
  }

  function updateHearts(){
    heartsEl.innerHTML = '';
    for (let i=0;i<player.maxHp;i++){
      const d = document.createElement('div');
      d.className = 'heart' + (i>=player.hp ? ' lost' : '');
      heartsEl.appendChild(d);
    }
  }

  function updateQuestText(){
    const map = {
      intro: 'Encontre o espírito guardião',
      active: 'Derrote as sombras e explore o bosque',
      ember: 'Leve a Brasa Perdida ao altar',
      complete: 'Missão concluída ✦'
    };
    questTextEl.textContent = map[quest] || '';
  }

  function setControlsVisible(v){ controls.style.display = v ? '' : 'none'; }

  // ---------- dialogue ----------
  function showDialogue(name, lines, onDone){
    dialogueQueue = lines; dialogueIndex = 0; dialogueOnDone = onDone;
    dlgName.textContent = name || 'Bosque';
    dlgText.textContent = dialogueQueue[0];
    dialogueBox.style.display = 'flex';
    setControlsVisible(false);
    gameState = 'dialogue';
  }
  function advanceDialogue(){
    dialogueIndex++;
    if (dialogueIndex < dialogueQueue.length){
      dlgText.textContent = dialogueQueue[dialogueIndex];
    } else {
      dialogueBox.style.display = 'none';
      gameState = 'playing';
      setControlsVisible(true);
      const cb = dialogueOnDone; dialogueOnDone = null;
      if (cb) cb();
    }
  }
  dialogueBox.addEventListener('touchstart', e=>{ e.preventDefault(); advanceDialogue(); }, {passive:false});
  dialogueBox.addEventListener('mousedown', advanceDialogue);

  // ---------- interactions ----------
  function nearestInteractable(){
    const targets = [
      { obj:npc, kind:'npc' },
      { obj:chest, kind:'chest' },
      { obj:shrine, kind:'shrine' }
    ];
    let best = null, bestD = 999;
    targets.forEach(t=>{
      const d = dist(player, t.obj);
      if (d < player.r+t.obj.r+10 && d < bestD){ bestD = d; best = t; }
    });
    return best;
  }

  function doInteract(){
    if (gameState !== 'playing') return;
    const target = nearestInteractable();
    if (!target) return;
    if (target.kind === 'npc') interactNpc();
    else if (target.kind === 'chest') interactChest();
    else interactShrine();
  }

  function interactNpc(){
    if (quest === 'intro'){
      showDialogue('Guardião', [
        'Viajante... as sombras tomaram este bosque.',
        'Encontre a Brasa Perdida escondida em um baú e leve-a até o altar a leste.',
        'Cuidado com os espíritos sombrios pelo caminho.'
      ], ()=>{ quest='active'; updateQuestText(); });
    } else if (quest === 'active'){
      showDialogue('Guardião', ['A Brasa deve estar guardada em algum baú por aqui perto.'], null);
    } else if (quest === 'ember'){
      showDialogue('Guardião', ['Você a encontrou! Agora leve a Brasa até o altar, a leste.'], null);
    } else {
      showDialogue('Guardião', ['Obrigado, viajante. A luz voltou ao bosque graças a você.'], null);
    }
  }

  function interactChest(){
    if (chest.opened){
      showDialogue('Bosque', ['O baú já está vazio.'], null);
      return;
    }
    chest.opened = true;
    chest.lidT = 1;
    if (quest === 'intro' || quest === 'active') quest = 'ember';
    updateQuestText();
    itemIconEl.classList.add('lit');
    floaters.push({ x:chest.x, y:chest.y-16, text:'+ Brasa Perdida', life:55, color:'#ffcf6b' });
    for (let i=0;i<10;i++){
      const a = Math.random()*Math.PI*2, sp=0.6+Math.random()*1.6;
      particles.push({ x:chest.x, y:chest.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:26, color:'255,207,107' });
    }
  }

  function interactShrine(){
    if (quest === 'ember'){
      shrine.activated = true;
      quest = 'complete';
      updateQuestText();
      victoryTimer = 50;
      for (let i=0;i<18;i++){
        const a = Math.random()*Math.PI*2, sp=1+Math.random()*2.4;
        particles.push({ x:shrine.x, y:shrine.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:40, color:'255,220,150' });
      }
    } else if (quest === 'complete'){
      showDialogue('Bosque', ['O altar brilha em paz.'], null);
    } else {
      showDialogue('Bosque', ['O altar precisa da Brasa Perdida para se acender.'], null);
    }
  }

  // ---------- combat ----------
  function spawnBurst(x,y,color,n){
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, sp=0.8+Math.random()*2;
      particles.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:24, color });
    }
  }

  function triggerAttack(){
    if (gameState !== 'playing') return;
    if (player.atkCd > 0) return;
    player.atkCd = 24; player.swingTimer = 14;
    const dir = facingVector(player.facing);
    const cx = player.x+dir.x*20, cy = player.y+dir.y*20;
    enemies.forEach(en=>{
      if (en.dead) return;
      if (Math.hypot(en.x-cx, en.y-cy) < 17+en.r){
        en.hp--; en.flash = 8;
        const kd = normalize(en.x-player.x, en.y-player.y);
        en.kb.x = kd.x*4.5; en.kb.y = kd.y*4.5;
        if (en.hp <= 0){
          en.dead = true; en.deathTimer = 22; defeated++;
          spawnBurst(en.x, en.y, '183,120,255', 12);
        }
      }
    });
  }

  function gameOver(){
    gameState = 'gameover';
    shake = 14; flash = 1;
    setControlsVisible(false);
    overlay.querySelector('.big').textContent = 'Você caiu no escuro...';
    overlay.querySelector('.small').innerHTML = 'sombras derrotadas: ' + defeated + '<br>toque para tentar de novo';
    overlay.style.display = 'flex';
  }

  function showVictory(){
    gameState = 'victory';
    setControlsVisible(false);
    overlay.querySelector('.big').textContent = 'A luz voltou ao bosque!';
    overlay.querySelector('.small').innerHTML = 'sombras derrotadas: ' + defeated + '<br>toque para jogar de novo';
    overlay.style.display = 'flex';
  }

  function startGame(){
    initWorld();
    gameState = 'playing';
    overlay.style.display = 'none';
    setControlsVisible(true);
  }

  // ---------- input ----------
  const keys = new Set();
  document.addEventListener('keydown', e=>{
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)) keys.add(e.code);
    if (e.code === 'Space'){ e.preventDefault(); if (gameState==='playing') triggerAttack(); else if (gameState==='ready'||gameState==='gameover'||gameState==='victory') startGame(); }
    if (e.code === 'KeyE'){ if (gameState==='playing') doInteract(); }
  });
  document.addEventListener('keyup', e=> keys.delete(e.code));
  function keyboardVector(){
    let x=0,y=0;
    if (keys.has('ArrowLeft')||keys.has('KeyA')) x-=1;
    if (keys.has('ArrowRight')||keys.has('KeyD')) x+=1;
    if (keys.has('ArrowUp')||keys.has('KeyW')) y-=1;
    if (keys.has('ArrowDown')||keys.has('KeyS')) y+=1;
    return {x,y};
  }

  const joystick = { active:false, id:null, baseX:0, baseY:0, dx:0, dy:0 };
  function joyStart(id, clientX, clientY){
    joystick.active = true; joystick.id = id;
    const rect = joyBase.getBoundingClientRect();
    joystick.baseX = rect.left+rect.width/2;
    joystick.baseY = rect.top+rect.height/2;
    joyMove(clientX, clientY);
  }
  function joyMove(clientX, clientY){
    if (!joystick.active) return;
    const dx = clientX-joystick.baseX, dy = clientY-joystick.baseY;
    const maxR = 30;
    const d = Math.min(maxR, Math.hypot(dx,dy));
    const ang = Math.atan2(dy,dx);
    joyKnob.style.transform = `translate(${Math.cos(ang)*d}px, ${Math.sin(ang)*d}px)`;
    if (d > 6){ joystick.dx = Math.cos(ang)*Math.min(1,d/maxR); joystick.dy = Math.sin(ang)*Math.min(1,d/maxR); }
    else { joystick.dx = 0; joystick.dy = 0; }
  }
  function joyEnd(id){
    if (joystick.id !== id) return;
    joystick.active = false; joystick.id = null; joystick.dx = 0; joystick.dy = 0;
    joyKnob.style.transform = 'translate(0px,0px)';
  }
  joyBase.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.changedTouches[0]; joyStart(t.identifier, t.clientX, t.clientY); }, {passive:false});
  window.addEventListener('touchmove', e=>{ for (const t of e.changedTouches){ if (t.identifier===joystick.id) joyMove(t.clientX,t.clientY); } }, {passive:true});
  window.addEventListener('touchend', e=>{ for (const t of e.changedTouches){ if (t.identifier===joystick.id) joyEnd(t.identifier); } });
  window.addEventListener('touchcancel', e=>{ for (const t of e.changedTouches){ if (t.identifier===joystick.id) joyEnd(t.identifier); } });
  joyBase.addEventListener('mousedown', e=> joyStart('mouse', e.clientX, e.clientY));
  window.addEventListener('mousemove', e=>{ if (joystick.id==='mouse') joyMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', ()=>{ if (joystick.id==='mouse') joyEnd('mouse'); });

  attackBtn.addEventListener('touchstart', e=>{ e.preventDefault(); triggerAttack(); }, {passive:false});
  attackBtn.addEventListener('mousedown', triggerAttack);
  interactBtn.addEventListener('touchstart', e=>{ e.preventDefault(); doInteract(); }, {passive:false});
  interactBtn.addEventListener('mousedown', doInteract);

  overlay.addEventListener('touchstart', e=>{ e.preventDefault(); if (gameState!=='playing'&&gameState!=='dialogue') startGame(); }, {passive:false});
  overlay.addEventListener('mousedown', ()=>{ if (gameState!=='playing'&&gameState!=='dialogue') startGame(); });

  // ---------- movement / collision ----------
  function moveWithCollision(entity, vx, vy){
    const rad = entity.r;
    if (vx !== 0){
      const nx = entity.x+vx;
      const top = entity.y-rad+3, bot = entity.y+rad-3;
      const edgeX = vx>0 ? nx+rad : nx-rad;
      if (!tileBlocked(edgeX, top) && !tileBlocked(edgeX, bot)) entity.x = nx;
    }
    if (vy !== 0){
      const ny = entity.y+vy;
      const left = entity.x-rad+3, right = entity.x+rad-3;
      const edgeY = vy>0 ? ny+rad : ny-rad;
      if (!tileBlocked(left, edgeY) && !tileBlocked(right, edgeY)) entity.y = ny;
    }
  }

  // ---------- update ----------
  function update(){
    if (player.atkCd > 0) player.atkCd--;
    if (player.swingTimer > 0) player.swingTimer--;
    if (player.invuln > 0) player.invuln--;

    const kb = keyboardVector();
    let ix = joystick.dx + kb.x, iy = joystick.dy + kb.y;
    const mag = Math.hypot(ix,iy);
    if (mag > 1){ ix/=mag; iy/=mag; }

    const kbMag = Math.hypot(playerKB.x, playerKB.y);
    if (kbMag > 0.3){
      moveWithCollision(player, playerKB.x, playerKB.y);
      playerKB.x *= 0.85; playerKB.y *= 0.85;
      player.moving = true;
    } else if (mag > 0.15){
      if (Math.abs(ix) > Math.abs(iy)) player.facing = ix>0 ? 'right' : 'left';
      else player.facing = iy>0 ? 'down' : 'up';
      moveWithCollision(player, ix*2.5, iy*2.5);
      player.moving = true;
    } else {
      player.moving = false;
    }

    player.x = clamp(player.x, TILE, WORLD_W-TILE);
    player.y = clamp(player.y, TILE, WORLD_H-TILE);

    enemies.forEach(en=>{
      if (en.dead){ if (en.deathTimer>0) en.deathTimer--; return; }
      if (en.flash>0) en.flash--;
      const kbm = Math.hypot(en.kb.x, en.kb.y);
      if (kbm > 0.3){
        en.x += en.kb.x; en.y += en.kb.y;
        en.kb.x *= 0.82; en.kb.y *= 0.82;
      } else {
        const dp = dist(player, en);
        if (dp < 95) en.mode = 'chase';
        else if (dp > 145) en.mode = 'wander';

        if (en.mode === 'chase'){
          const d = normalize(player.x-en.x, player.y-en.y);
          en.x += d.x*1.5; en.y += d.y*1.5;
          en.facing = Math.abs(d.x)>Math.abs(d.y) ? (d.x>0?'right':'left') : (d.y>0?'down':'up');
        } else {
          en.wanderTimer--;
          if (en.wanderTimer <= 0){
            en.wanderTarget = { x: en.homeX+(Math.random()-0.5)*70, y: en.homeY+(Math.random()-0.5)*70 };
            en.wanderTimer = 80+Math.random()*90;
          }
          const d = normalize(en.wanderTarget.x-en.x, en.wanderTarget.y-en.y);
          if (dist(en, en.wanderTarget) > 4){ en.x += d.x*0.55; en.y += d.y*0.55; }
        }
      }
      en.x = clamp(en.x, TILE, WORLD_W-TILE);
      en.y = clamp(en.y, TILE, WORLD_H-TILE);
      en.bob += 0.08;

      if (player.invuln <= 0){
        const dp2 = dist(player, en);
        if (dp2 < player.r+en.r){
          player.hp--; updateHearts();
          player.invuln = 75; shake = 8; flash = 0.7;
          const d = normalize(player.x-en.x, player.y-en.y);
          playerKB.x = d.x*5; playerKB.y = d.y*5;
          if (player.hp <= 0) gameOver();
        }
      }
    });

    if (chest.lidT > 0) chest.lidT = Math.max(0, chest.lidT-0.05);

    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--; });
    particles = particles.filter(p=>p.life>0);
    floaters.forEach(f=>{ f.y -= 0.4; f.life--; });
    floaters = floaters.filter(f=>f.life>0);

    fireflies.forEach(f=>{ f.phase += f.speed*0.02; });

    camera.x = clamp(player.x-W/2, 0, WORLD_W-W);
    camera.y = clamp(player.y-H/2, 0, WORLD_H-H);

    if (shake>0) shake -= 0.6;
    if (flash>0) flash -= 0.045;

    if (victoryTimer > 0){
      victoryTimer--;
      if (victoryTimer === 0) showVictory();
    }

    interactBtn.classList.toggle('active', !!nearestInteractable());
  }

  // ---------- render ----------
  function drawTile(t, sx, sy){
    if (t==='.'){
      ctx.fillStyle = ((Math.floor(sx/TILE)+Math.floor(sy/TILE))%2===0) ? '#0d2116' : '#0f2519';
      ctx.fillRect(sx,sy,TILE,TILE);
    } else if (t==='#'){
      ctx.fillStyle = '#0d2116';
      ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle = '#3a2417';
      ctx.fillRect(sx+TILE/2-3, sy+TILE/2+2, 6, TILE/2-4);
      ctx.fillStyle = '#12331f';
      ctx.strokeStyle = 'rgba(180,150,80,0.25)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(sx+TILE/2, sy+TILE/2-2, TILE/2-3, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
    } else if (t==='o'){
      ctx.fillStyle = '#0d2116';
      ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle = '#4a4550';
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(sx+TILE/2, sy+TILE/2+4, TILE/2-4, TILE/2-8, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
    } else if (t==='~'){
      const shimmer = Math.sin(frameCount*0.05 + sx*0.1)*8;
      ctx.fillStyle = '#0c2b3a';
      ctx.fillRect(sx,sy,TILE,TILE);
      ctx.strokeStyle = `rgba(140,210,230,${0.15+Math.sin(frameCount*0.04+sy*0.1)*0.1})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx, sy+TILE/2+shimmer*0.2);
      ctx.lineTo(sx+TILE, sy+TILE/2-shimmer*0.2);
      ctx.stroke();
    }
  }

  function drawMap(){
    const c0 = Math.max(0, Math.floor(camera.x/TILE));
    const c1 = Math.min(COLS-1, Math.ceil((camera.x+W)/TILE));
    const r0 = Math.max(0, Math.floor(camera.y/TILE));
    const r1 = Math.min(ROWS-1, Math.ceil((camera.y+H)/TILE));
    for (let r=r0;r<=r1;r++){
      for (let c=c0;c<=c1;c++){
        drawTile(mapGrid[r][c], c*TILE-camera.x, r*TILE-camera.y);
      }
    }
  }

  function drawNpc(){
    const sx = npc.x-camera.x, sy = npc.y-camera.y+Math.sin(frameCount*0.05)*2;
    ctx.save();
    ctx.shadowColor = 'rgba(143,233,201,0.8)';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#dffff2';
    ctx.beginPath();
    ctx.ellipse(sx, sy, 9, 13, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#8fe9c9';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.restore();
    if (quest === 'intro'){
      ctx.save();
      ctx.fillStyle = '#ffcf6b';
      ctx.font = '700 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('!', sx, sy-20+Math.sin(frameCount*0.1)*3);
      ctx.restore();
    }
  }

  function drawChest(){
    const sx = chest.x-camera.x, sy = chest.y-camera.y;
    ctx.save();
    ctx.shadowColor = 'rgba(255,207,107,0.6)';
    ctx.shadowBlur = chest.opened ? 4 : 9;
    ctx.fillStyle = '#3a2417';
    ctx.fillRect(sx-12, sy-8, 24, 16);
    ctx.strokeStyle = '#ffcf6b';
    ctx.lineWidth = 1.4;
    ctx.strokeRect(sx-12, sy-8, 24, 16);
    const lidOpen = chest.opened ? 1-chest.lidT*0 : 0;
    ctx.save();
    ctx.translate(sx-12, sy-8);
    ctx.rotate(chest.opened ? -0.6 : 0);
    ctx.fillStyle = '#4a2f1d';
    ctx.fillRect(0,-6,24,7);
    ctx.strokeStyle = '#ffcf6b';
    ctx.strokeRect(0,-6,24,7);
    ctx.restore();
    ctx.restore();
  }

  function drawShrine(){
    const sx = shrine.x-camera.x, sy = shrine.y-camera.y;
    ctx.save();
    ctx.fillStyle = '#413f47';
    ctx.fillRect(sx-14, sy+2, 28, 12);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.strokeRect(sx-14, sy+2, 28, 12);
    const glowColor = shrine.activated ? 'rgba(255,220,150,0.95)' : 'rgba(150,150,170,0.4)';
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = shrine.activated ? 20+Math.sin(frameCount*0.1)*6 : 6;
    ctx.fillStyle = shrine.activated ? '#ffdc96' : '#5b5b66';
    ctx.beginPath();
    ctx.arc(sx, sy-4, shrine.activated?7:5, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawEnemy(en){
    if (en.dead && en.deathTimer<=0) return;
    const sx = en.x-camera.x, sy = en.y-camera.y+Math.sin(en.bob)*3;
    const alpha = en.dead ? en.deathTimer/22 : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = en.flash>0 ? 'rgba(255,255,255,0.9)' : 'rgba(183,120,255,0.75)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = en.flash>0 ? '#ffffff' : '#241332';
    ctx.beginPath();
    ctx.ellipse(sx, sy, 10, 12, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#b478ff';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.fillStyle = '#e6d4ff';
    ctx.beginPath(); ctx.arc(sx-3,sy-1,1.6,0,Math.PI*2); ctx.arc(sx+3,sy-1,1.6,0,Math.PI*2); ctx.fill();
    ctx.restore();

    if (!en.dead){
      const w = 20;
      const hpFrac = en.hp/en.maxHp;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(sx-w/2, sy-22, w, 3);
      ctx.fillStyle = '#b478ff';
      ctx.fillRect(sx-w/2, sy-22, w*hpFrac, 3);
    }
  }

  function drawPlayer(){
    const sx = player.x-camera.x, sy = player.y-camera.y;
    if (player.invuln>0 && Math.floor(player.invuln/5)%2===0) return;

    if (player.swingTimer > 0){
      const dir = facingVector(player.facing);
      const ang = Math.atan2(dir.y,dir.x);
      ctx.save();
      ctx.translate(sx,sy);
      ctx.rotate(ang);
      ctx.strokeStyle = 'rgba(255,207,107,0.85)';
      ctx.lineWidth = 3;
      ctx.shadowColor = 'rgba(255,207,107,0.8)';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(0,0,22,-0.7,0.7);
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.shadowColor = 'rgba(255,207,107,0.7)';
    ctx.shadowBlur = 9;
    ctx.fillStyle = '#161018';
    ctx.beginPath();
    ctx.ellipse(sx, sy, 10, 13, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffcf6b';
    ctx.lineWidth = 1.8;
    ctx.stroke();

    const dir = facingVector(player.facing);
    ctx.fillStyle = '#ffe3ad';
    ctx.beginPath();
    ctx.arc(sx+dir.x*5, sy+dir.y*5-1, 2.2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawFireflies(){
    fireflies.forEach(f=>{
      const wob = Math.sin(f.phase)*10;
      const sx = f.x-camera.x+wob, sy = f.y-camera.y+Math.cos(f.phase*1.3)*10;
      if (sx<-10||sx>W+10||sy<-10||sy>H+10) return;
      const a = 0.35+Math.sin(f.phase*2)*0.3;
      ctx.fillStyle = `rgba(255,224,150,${Math.max(0,a)})`;
      ctx.beginPath(); ctx.arc(sx,sy,1.8,0,Math.PI*2); ctx.fill();
    });
  }

  function drawParticlesAndFloaters(){
    particles.forEach(p=>{
      ctx.fillStyle = `rgba(${p.color},${Math.max(0,p.life/26)})`;
      ctx.beginPath(); ctx.arc(p.x-camera.x, p.y-camera.y, 2, 0, Math.PI*2); ctx.fill();
    });
    floaters.forEach(f=>{
      ctx.save();
      ctx.globalAlpha = Math.max(0, f.life/55);
      ctx.fillStyle = f.color;
      ctx.font = '700 12px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.shadowColor = f.color; ctx.shadowBlur = 6;
      ctx.fillText(f.text, f.x-camera.x, f.y-camera.y);
      ctx.restore();
    });
  }

  function drawVignette(){
    const g = ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(0,0,0,0.55)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  let frameCount = 0;
  function render(){
    ctx.save();
    if (shake>0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    ctx.clearRect(-20,-20,W+40,H+40);

    drawMap();
    drawFireflies();
    drawChest();
    drawNpc();
    drawShrine();

    const drawables = enemies.filter(e=>!e.dead || e.deathTimer>0).concat([{__player:true}]);
    drawables.sort((a,b)=>{
      const ay = a.__player ? player.y : a.y;
      const by = b.__player ? player.y : b.y;
      return ay-by;
    });
    drawables.forEach(d=> d.__player ? drawPlayer() : drawEnemy(d));

    drawParticlesAndFloaters();
    drawVignette();

    if (flash>0){
      ctx.fillStyle = `rgba(255,90,90,${flash*0.28})`;
      ctx.fillRect(0,0,W,H);
    }
    ctx.restore();
  }

  function loop(){
    frameCount++;
    if (gameState === 'playing') update();
    render();
    requestAnimationFrame(loop);
  }

  initWorld();
  render();
  requestAnimationFrame(loop);
})();
</script>
