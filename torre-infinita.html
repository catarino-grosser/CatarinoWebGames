<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Torre Infinita</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height:100%;
    background: #050308;
    overflow:hidden;
    touch-action: manipulation;
  }
  body {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #wrap {
    width:100%;
    max-width:380px;
    padding:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  h1 {
    color:#e3d9ff;
    font-size:14px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:600;
    opacity:0.85;
  }
  #stage {
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(177,138,255,0.18), 0 20px 60px -20px rgba(0,0,0,0.85);
  }
  canvas {
    display:block;
    width:100%;
    height:auto;
    background:#050308;
  }
  #hud {
    position:absolute;
    top:10px;
    left:0; right:0;
    display:flex;
    justify-content:space-between;
    padding:0 14px;
    font-family: 'Courier New', monospace;
    font-weight:700;
    font-size:14px;
    color:#ede7ff;
    text-shadow: 0 0 8px rgba(177,138,255,0.55);
    pointer-events:none;
  }
  #overlay {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:rgba(5,3,8,0.4);
    color:#ede7ff;
    text-align:center;
    padding:20px;
  }
  #overlay .big {
    font-size:18px;
    font-weight:700;
    letter-spacing:0.03em;
  }
  #overlay .small {
    font-size:12px;
    opacity:0.75;
    font-family: 'Courier New', monospace;
  }
  #hint {
    color:#585268;
    font-size:12px;
    letter-spacing:0.04em;
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>Torre Infinita</h1>
  <div id="stage">
    <canvas id="game" width="320" height="520"></canvas>
    <div id="hud">
      <span id="score">000</span>
      <span id="best">MELHOR 000</span>
    </div>
    <div id="overlay">
      <div class="big">Toque para começar</div>
      <div class="small">toque no momento certo para encaixar o bloco</div>
    </div>
  </div>
  <div id="hint">toque na tela · barra de espaço no computador</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');

  const blockH = 26;
  const baseY = H - 70;
  const playLeft = 26, playRight = W - 26;
  const targetScreenY = 170;

  let best = 0;
  let state = 'ready';
  let frame = 0;
  let score = 0;
  let shake = 0;
  let flash = 0;

  let blocks = [];
  let moving = null;
  let debris = [];
  let floaters = [];
  const camera = { offset: baseY-(H-40), target: baseY-(H-40) };

  const stars = [];
  for (let i=0;i<50;i++){
    stars.push({x:Math.random(), y:Math.random()*0.6, r:Math.random()*1.2+0.3, tw:Math.random()*Math.PI*2});
  }
  const buildings = [];
  for (let i=0;i<10;i++){
    buildings.push({
      x: 10 + i*33 + Math.random()*10,
      w: 16+Math.random()*14,
      h: 14+Math.random()*30,
      lit: Math.random()<0.5
    });
  }

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function screenY(worldY){ return worldY - camera.offset; }
  function pad(n){ return String(n).padStart(3,'0'); }

  function resetGame(){
    const initialW = 120;
    blocks = [{ x:(W-initialW)/2, w:initialW, y: baseY-blockH, hue:0 }];
    debris = [];
    floaters = [];
    score = 0;
    frame = 0;
    camera.offset = baseY-(H-40);
    camera.target = camera.offset;
    scoreEl.textContent = '000';
    spawnMoving();
  }

  function spawnMoving(){
    const i = blocks.length;
    const last = blocks[blocks.length-1];
    const w = last.w;
    const fromLeft = i % 2 === 0;
    const y = baseY - (i+1)*blockH;
    const speed = Math.min(5.2, 2.1 + i*0.045);
    moving = {
      x: fromLeft ? playLeft : playRight-w,
      w, y, dir: fromLeft?1:-1, speed,
      hue: (i*33) % 360
    };
    const newTarget = y - targetScreenY;
    camera.target = Math.min(camera.target, newTarget);
  }

  function startGame(){
    resetGame();
    state = 'playing';
    overlay.style.display = 'none';
  }

  function endGame(){
    state = 'over';
    shake = 14;
    flash = 1;
    if (score > best){ best = score; bestEl.textContent = 'MELHOR ' + pad(best); }
    overlay.querySelector('.big').textContent = 'Torre caiu! Pontos: ' + score;
    overlay.querySelector('.small').textContent = 'toque para tentar de novo';
    overlay.style.display = 'flex';
  }

  function spawnDebris(x,y,w,h,hue,dir){
    debris.push({
      x, y, w, h, hue,
      vx: dir*(1.3+Math.random()*1.3),
      vy: -1.5-Math.random()*1.5,
      rot: 0, rotV: dir*(0.06+Math.random()*0.05),
      life: 80
    });
  }

  function drop(){
    if (state !== 'playing'){ startGame(); return; }

    const last = blocks[blocks.length-1];
    const overlapLeft = Math.max(moving.x, last.x);
    const overlapRight = Math.min(moving.x+moving.w, last.x+last.w);
    const overlapW = overlapRight - overlapLeft;
    const sy = screenY(moving.y);

    if (overlapW <= 0){
      spawnDebris(moving.x, sy, moving.w, blockH, moving.hue, moving.dir*2);
      endGame();
      return;
    }

    const perfect = overlapW >= moving.w - 6 && overlapW >= last.w - 6;
    let placed;
    if (perfect){
      placed = { x:last.x, w:last.w, y:moving.y, hue:moving.hue };
      score += 2;
      floaters.push({x: placed.x+placed.w/2, y: sy, text:'PERFEITO!', life:36, color:'#fff6d5'});
    } else {
      placed = { x:overlapLeft, w:overlapW, y:moving.y, hue:moving.hue };
      score += 1;
      let leftoverX, leftoverW, dir;
      if (moving.x < overlapLeft){
        leftoverX = moving.x; leftoverW = overlapLeft-moving.x; dir=-1;
      } else {
        leftoverX = overlapRight; leftoverW = (moving.x+moving.w)-overlapRight; dir=1;
      }
      if (leftoverW > 0.6) spawnDebris(leftoverX, sy, leftoverW, blockH, moving.hue, dir);
    }

    blocks.push(placed);
    scoreEl.textContent = pad(score);
    shake = perfect ? 5 : 2.5;
    spawnMoving();
  }

  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); drop(); }, {passive:false});
  canvas.addEventListener('mousedown', drop);
  overlay.addEventListener('touchstart', e=>{ e.preventDefault(); if (state!=='playing') startGame(); }, {passive:false});
  overlay.addEventListener('mousedown', ()=>{ if (state!=='playing') startGame(); });
  document.addEventListener('keydown', e=>{
    if (e.code === 'Space'){ e.preventDefault(); drop(); }
  });

  function update(){
    frame++;
    moving.x += moving.dir*moving.speed;
    if (moving.x <= playLeft){ moving.x = playLeft; moving.dir = 1; }
    if (moving.x + moving.w >= playRight){ moving.x = playRight-moving.w; moving.dir = -1; }

    camera.offset = lerp(camera.offset, camera.target, 0.12);

    debris.forEach(d=>{
      d.x += d.vx; d.y += d.vy; d.vy += 0.32; d.rot += d.rotV; d.life--;
    });
    debris = debris.filter(d => d.life>0 && d.y < H+60);

    floaters.forEach(f=>{ f.y -= 0.45; f.life--; });
    floaters = floaters.filter(f=>f.life>0);

    if (shake>0) shake -= 0.6;
    if (flash>0) flash -= 0.05;
  }

  function drawBackground(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0a0620');
    g.addColorStop(0.55,'#150a2b');
    g.addColorStop(1,'#050308');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    stars.forEach(s=>{
      const a = 0.3 + Math.sin(frame*0.025+s.tw)*0.3;
      ctx.fillStyle = `rgba(220,220,255,${Math.max(0,a)})`;
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2); ctx.fill();
    });

    ctx.save();
    ctx.shadowColor = 'rgba(232,230,255,0.5)';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#e8e6ff';
    ctx.beginPath(); ctx.arc(W-46, 56, 15, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0a0620';
    ctx.beginPath(); ctx.arc(W-40, 50, 15, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    const gy = screenY(baseY+4);
    buildings.forEach(b=>{
      const by = gy - b.h;
      ctx.fillStyle = 'rgba(18,10,32,0.9)';
      ctx.fillRect(b.x, by, b.w, b.h+80);
      if (b.lit){
        ctx.fillStyle = 'rgba(255,220,150,0.5)';
        ctx.fillRect(b.x+b.w*0.3, by+6, 2, 2);
        ctx.fillRect(b.x+b.w*0.6, by+14, 2, 2);
      }
    });
  }

  function drawBlock(x, sy, w, h, hue, glowBoost){
    const stroke = `hsl(${hue},85%,${65+glowBoost}%)`;
    ctx.save();
    ctx.shadowColor = stroke;
    ctx.shadowBlur = 8+glowBoost*0.6;
    ctx.fillStyle = '#0c0c16';
    ctx.beginPath();
    ctx.roundRect(x, sy, w, h, 4);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = `hsla(${hue},85%,70%,0.28)`;
    ctx.fillRect(x+2, sy+2, w-4, h*0.32);
    ctx.restore();
  }

  function drawTower(){
    for (let i=0;i<blocks.length;i++){
      const b = blocks[i];
      const sy = screenY(b.y);
      if (sy > H+30 || sy < -40) continue;
      drawBlock(b.x, sy, b.w, blockH, b.hue, 0);
    }
    if (state==='playing' && moving){
      drawBlock(moving.x, screenY(moving.y), moving.w, blockH, moving.hue, 14);
    }
  }

  function drawDebris(){
    debris.forEach(d=>{
      ctx.save();
      ctx.globalAlpha = Math.max(0, d.life/80);
      ctx.translate(d.x+d.w/2, d.y+blockH/2);
      ctx.rotate(d.rot);
      ctx.translate(-d.w/2,-blockH/2);
      drawBlock(0,0,d.w,blockH,d.hue,0);
      ctx.restore();
    });
  }

  function drawFloaters(){
    floaters.forEach(f=>{
      ctx.save();
      ctx.globalAlpha = Math.max(0, f.life/36);
      ctx.fillStyle = f.color;
      ctx.font = '700 13px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 8;
      ctx.fillText(f.text, f.x, f.y-8);
      ctx.restore();
    });
  }

  function render(){
    ctx.save();
    if (shake>0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    ctx.clearRect(-20,-20,W+40,H+40);
    drawBackground();
    drawTower();
    drawDebris();
    drawFloaters();

    if (flash>0){
      ctx.fillStyle = `rgba(255,90,90,${flash*0.3})`;
      ctx.fillRect(0,0,W,H);
    }
    ctx.restore();
  }

  function loop(){
    if (state==='playing') update();
    render();
    requestAnimationFrame(loop);
  }

  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
