<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Peixe Contra a Correnteza</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height:100%;
    background: #031522;
    overflow:hidden;
    touch-action: manipulation;
  }
  body {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #wrap {
    width:100%;
    max-width:480px;
    padding:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  h1 {
    color:#bfeeff;
    font-size:15px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:600;
    opacity:0.85;
  }
  #stage {
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(120,210,255,0.18), 0 20px 60px -20px rgba(0,0,0,0.8);
  }
  canvas {
    display:block;
    width:100%;
    height:auto;
    background:#031522;
  }
  #hud {
    position:absolute;
    top:10px;
    left:0; right:0;
    display:flex;
    justify-content:space-between;
    padding:0 14px;
    font-family: 'Courier New', monospace;
    font-weight:700;
    font-size:15px;
    color:#e2f8ff;
    text-shadow: 0 0 8px rgba(120,210,255,0.55);
    pointer-events:none;
  }
  #overlay {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:rgba(3,21,34,0.35);
    color:#e2f8ff;
    text-align:center;
    padding:20px;
  }
  #overlay .big {
    font-size:19px;
    font-weight:700;
    letter-spacing:0.03em;
  }
  #overlay .small {
    font-size:13px;
    opacity:0.75;
    font-family: 'Courier New', monospace;
  }
  #hint {
    color:#4f6577;
    font-size:12px;
    letter-spacing:0.04em;
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>Peixe Contra a Correnteza</h1>
  <div id="stage">
    <canvas id="game" width="400" height="230"></canvas>
    <div id="hud">
      <span id="score">000</span>
      <span id="best">MELHOR 000</span>
    </div>
    <div id="overlay">
      <div class="big">Toque para começar</div>
      <div class="small">toque para nadar · desvie dos corais</div>
    </div>
  </div>
  <div id="hint">toque na tela · barra de espaço no computador</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const surfaceY = 14;
  const floorY = H - 26;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');

  let best = 0;
  let state = 'ready';
  let frame = 0;
  let score = 0;
  let shake = 0;
  let flash = 0;

  const GRAVITY = 0.34;
  const FLAP_V = -5.6;

  const fish = { x: 92, y: H/2, r: 12, vy: 0, angle: 0, tailPhase: 0 };
  let obstacles = [];
  let particles = [];
  let bubbles = [];

  for (let i=0;i<18;i++){
    bubbles.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*2+0.6, vy:0.2+Math.random()*0.5, drift:Math.random()*0.6-0.3});
  }
  const plankton = [];
  for (let i=0;i<30;i++){
    plankton.push({x:Math.random(), y:Math.random(), r:Math.random()*1.1+0.3, tw:Math.random()*Math.PI*2});
  }

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  function resetGame(){
    obstacles = [];
    particles = [];
    score = 0;
    frame = 0;
    spawnTimer = 0;
    nextSpawn = 62;
    fish.y = H/2; fish.vy = 0; fish.angle = 0;
    scoreEl.textContent = '000';
  }

  function startGame(){
    resetGame();
    state = 'playing';
    overlay.style.display = 'none';
  }

  function endGame(){
    state = 'over';
    shake = 12;
    flash = 1;
    if (score > best){ best = score; bestEl.textContent = 'MELHOR ' + String(best).padStart(3,'0'); }
    overlay.querySelector('.big').textContent = 'Bateu no coral! Pontos: ' + score;
    overlay.querySelector('.small').textContent = 'toque para tentar de novo';
    overlay.style.display = 'flex';
  }

  function flap(){
    if (state === 'ready' || state === 'over'){ startGame(); return; }
    if (state === 'playing'){
      fish.vy = FLAP_V;
      for (let i=0;i<4;i++){
        particles.push({x:fish.x-8, y:fish.y+6, vx:-1-Math.random()*1.4, vy:(Math.random()-0.5)*1.2, life:16, type:'bubble'});
      }
    }
  }

  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); flap(); }, {passive:false});
  canvas.addEventListener('mousedown', flap);
  overlay.addEventListener('touchstart', e=>{ e.preventDefault(); flap(); }, {passive:false});
  overlay.addEventListener('mousedown', flap);
  document.addEventListener('keydown', e=>{
    if (e.code==='Space' || e.code==='ArrowUp'){ e.preventDefault(); flap(); }
  });

  let spawnTimer = 0, nextSpawn = 62;

  function spawnObstacle(){
    const t = frame/60;
    const gapH = Math.max(58, 92 - t*1.1);
    const gapY = clamp(surfaceY + 50 + Math.random()*(floorY-surfaceY-100), surfaceY+40, floorY-40);
    obstacles.push({
      x: W+20, w: 32, gapY, gapH,
      passed:false, pearlCollected:false
    });
  }

  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function update(){
    frame++;
    const t = frame/60;
    const speed = 2.5 + Math.min(2.2, t*0.045);

    fish.vy += GRAVITY;
    fish.y += fish.vy;
    fish.angle = clamp(fish.vy*3.2, -28, 65);
    fish.tailPhase += 0.28;

    if (fish.y - fish.r < surfaceY || fish.y + fish.r > floorY){
      fish.y = clamp(fish.y, surfaceY+fish.r, floorY-fish.r);
      endGame();
    }

    spawnTimer++;
    if (spawnTimer > nextSpawn){
      spawnObstacle();
      spawnTimer = 0;
      nextSpawn = Math.max(58, 100 - t*1.6) ;
    }

    obstacles.forEach(o=> o.x -= speed);
    obstacles = obstacles.filter(o => o.x + o.w > -20);

    const fBox = {x: fish.x-fish.r*0.8, y: fish.y-fish.r*0.6, w: fish.r*1.6, h: fish.r*1.2};

    obstacles.forEach(o=>{
      const topRect = {x:o.x, y:surfaceY, w:o.w, h:(o.gapY-o.gapH/2)-surfaceY};
      const botRect = {x:o.x, y:o.gapY+o.gapH/2, w:o.w, h:floorY-(o.gapY+o.gapH/2)};
      if (state==='playing' && (rectsOverlap(fBox, topRect) || rectsOverlap(fBox, botRect))){
        endGame();
      }
      if (!o.passed && o.x+o.w < fish.x){
        o.passed = true;
        score += 1;
        scoreEl.textContent = String(score).padStart(3,'0');
      }
      if (!o.pearlCollected){
        const dx = fish.x-(o.x+o.w/2), dy = fish.y-o.gapY;
        if (Math.sqrt(dx*dx+dy*dy) < fish.r+8){
          o.pearlCollected = true;
          score += 1;
          scoreEl.textContent = String(score).padStart(3,'0');
          for (let i=0;i<8;i++){
            const a = Math.random()*Math.PI*2, sp=1+Math.random()*1.8;
            particles.push({x:o.x+o.w/2, y:o.gapY, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:20, type:'spark'});
          }
        }
      }
    });

    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if (p.type==='bubble') p.vy -= 0.02;
      p.life--;
    });
    particles = particles.filter(p=>p.life>0);

    bubbles.forEach(b=>{
      b.y -= b.vy; b.x += Math.sin(frame*0.02+b.x)*b.drift*0.05;
      if (b.y < surfaceY){ b.y = floorY; b.x = Math.random()*W; }
    });

    if (shake>0) shake -= 0.7;
    if (flash>0) flash -= 0.05;
  }

  function drawBackground(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0a4a63');
    g.addColorStop(0.5,'#053349');
    g.addColorStop(1,'#031522');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // light rays
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = '#eafcff';
    for (let i=0;i<4;i++){
      const x = ((i*130 + frame*0.15) % (W+160)) - 80;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x+50, 0);
      ctx.lineTo(x-10, H*0.75);
      ctx.lineTo(x-60, H*0.75);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    plankton.forEach(p=>{
      const a = 0.25 + Math.sin(frame*0.03+p.tw)*0.25;
      ctx.fillStyle = `rgba(190,240,255,${Math.max(0,a)})`;
      ctx.beginPath(); ctx.arc(p.x*W, p.y*(floorY-surfaceY)+surfaceY, p.r, 0, Math.PI*2); ctx.fill();
    });

    bubbles.forEach(b=>{
      ctx.strokeStyle = 'rgba(200,240,255,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.stroke();
    });
  }

  function drawSurfaceAndFloor(){
    ctx.fillStyle = 'rgba(180,235,255,0.16)';
    ctx.fillRect(0,0,W,surfaceY);
    ctx.strokeStyle = 'rgba(200,240,255,0.5)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0,surfaceY); ctx.lineTo(W,surfaceY); ctx.stroke();

    ctx.fillStyle = '#04202f';
    ctx.fillRect(0,floorY,W,H-floorY);
    ctx.strokeStyle = 'rgba(120,200,220,0.4)';
    ctx.beginPath(); ctx.moveTo(0,floorY); ctx.lineTo(W,floorY); ctx.stroke();
    const off = frame % 20;
    ctx.fillStyle = 'rgba(120,200,220,0.25)';
    for (let x=-off; x<W; x+=20){ ctx.fillRect(x, floorY+7, 9, 2); }
  }

  function drawObstacle(o){
    const drawCoral = (x, yStart, h, up) => {
      ctx.fillStyle = '#ff8a65';
      ctx.strokeStyle = 'rgba(255,196,120,0.55)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      const spikes = 4;
      const step = o.w/spikes;
      if (up){
        ctx.moveTo(x, yStart);
        for (let i=0;i<=spikes;i++){
          const px = x+i*step;
          const py = i%2===0 ? yStart+h : yStart+h-10;
          ctx.lineTo(px, py);
        }
        ctx.lineTo(x+o.w, yStart);
      } else {
        ctx.moveTo(x, yStart+h);
        for (let i=0;i<=spikes;i++){
          const px = x+i*step;
          const py = i%2===0 ? yStart : yStart+10;
          ctx.lineTo(px, py);
        }
        ctx.lineTo(x+o.w, yStart+h);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    };
    const topH = (o.gapY-o.gapH/2)-surfaceY;
    const botH = floorY-(o.gapY+o.gapH/2);
    drawCoral(o.x, surfaceY, topH, false);
    drawCoral(o.x, o.gapY+o.gapH/2, botH, true);

    if (!o.pearlCollected){
      ctx.save();
      const pulse = 4+Math.sin(frame*0.15)*1.4;
      ctx.shadowColor = 'rgba(255,246,213,0.9)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#fff6d5';
      ctx.beginPath();
      ctx.arc(o.x+o.w/2, o.gapY, pulse, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawFish(){
    ctx.save();
    ctx.translate(fish.x, fish.y);
    ctx.rotate(fish.angle*Math.PI/180);

    const tailSwing = Math.sin(fish.tailPhase)*8;
    ctx.fillStyle = 'rgba(255,143,163,0.9)';
    ctx.beginPath();
    ctx.moveTo(-fish.r, 0);
    ctx.lineTo(-fish.r-10, -6+tailSwing*0.4);
    ctx.lineTo(-fish.r-10, 6+tailSwing*0.4);
    ctx.closePath();
    ctx.fill();

    ctx.shadowColor = 'rgba(191,238,255,0.7)';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#bfeeff';
    ctx.beginPath();
    ctx.ellipse(0,0, fish.r, fish.r*0.72, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,143,163,0.85)';
    ctx.beginPath();
    ctx.moveTo(-2,-fish.r*0.6);
    ctx.lineTo(4,-fish.r*1.15);
    ctx.lineTo(8,-fish.r*0.5);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#052030';
    ctx.beginPath();
    ctx.arc(fish.r*0.42, -2, 2, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  function render(){
    ctx.save();
    if (shake>0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    ctx.clearRect(-20,-20,W+40,H+40);
    drawBackground();
    drawSurfaceAndFloor();
    obstacles.forEach(drawObstacle);

    particles.forEach(p=>{
      if (p.type==='bubble'){
        ctx.strokeStyle = `rgba(210,245,255,${Math.max(0,p.life/16*0.7)})`;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(p.x,p.y,2,0,Math.PI*2); ctx.stroke();
      } else {
        ctx.fillStyle = `rgba(255,246,213,${Math.max(0,p.life/20*0.8)})`;
        ctx.beginPath(); ctx.arc(p.x,p.y,1.8,0,Math.PI*2); ctx.fill();
      }
    });

    drawFish();

    if (flash>0){
      ctx.fillStyle = `rgba(255,90,90,${flash*0.3})`;
      ctx.fillRect(0,0,W,H);
    }
    ctx.restore();
  }

  function loop(){
    if (state==='playing') update();
    render();
    requestAnimationFrame(loop);
  }

  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
