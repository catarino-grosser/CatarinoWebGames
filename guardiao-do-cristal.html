<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Guardião do Cristal</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body {
    height:100%;
    background: #07060d;
    overflow:hidden;
    touch-action: manipulation;
  }
  body {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #wrap {
    width:100%;
    max-width:400px;
    padding:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  h1 {
    color:#fef3c7;
    font-size:14px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:600;
    opacity:0.85;
  }
  #stage {
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(251,191,36,0.2), 0 20px 60px -20px rgba(0,0,0,0.85);
  }
  canvas {
    display:block;
    width:100%;
    height:auto;
    background:#07060d;
  }
  #hud {
    position:absolute;
    top:10px;
    left:0; right:0;
    display:flex;
    flex-direction:column;
    gap:6px;
    pointer-events:none;
  }
  .hud-row {
    display:flex;
    justify-content:space-between;
    padding:0 14px;
    font-family:'Courier New', monospace;
    font-weight:700;
    font-size:14px;
    color:#fff3d6;
    text-shadow:0 0 8px rgba(251,191,36,0.55);
  }
  #wave {
    text-align:center;
    font-family:'Courier New', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color:rgba(254,243,199,0.55);
  }
  #hearts { display:flex; gap:5px; justify-content:center; }
  .heart {
    width:10px; height:10px; border-radius:50% 50% 50% 0;
    transform:rotate(45deg);
    background:#fb7185;
    box-shadow:0 0 6px rgba(251,113,133,0.8);
  }
  .heart.lost { background:transparent; border:1.5px solid rgba(255,255,255,0.22); box-shadow:none; }
  #overlay {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:rgba(7,6,13,0.5);
    color:#fff8e8;
    text-align:center;
    padding:24px;
  }
  #overlay .big { font-size:18px; font-weight:700; letter-spacing:0.03em; }
  #overlay .small { font-size:12px; opacity:0.75; font-family:'Courier New', monospace; max-width:260px; }
  #hint { color:#524a3a; font-size:12px; letter-spacing:0.04em; text-align:center; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Guardião do Cristal</h1>
  <div id="stage">
    <canvas id="game" width="360" height="360"></canvas>
    <div id="hud">
      <div class="hud-row">
        <span id="score">000</span>
        <span id="best">MELHOR 000</span>
      </div>
      <div id="wave">ONDA 1</div>
      <div id="hearts">
        <div class="heart"></div><div class="heart"></div><div class="heart"></div>
        <div class="heart"></div><div class="heart"></div>
      </div>
    </div>
    <div id="overlay">
      <div class="big">Guardião do Cristal</div>
      <div class="small">toque nas sombras antes que elas alcancem o cristal no centro</div>
    </div>
  </div>
  <div id="hint">toque nas sombras para destruí-las</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const center = {x:W/2, y:H/2};
  const crystalR = 24;
  const spawnRadius = 162;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const waveEl = document.getElementById('wave');
  const overlay = document.getElementById('overlay');
  const hearts = document.querySelectorAll('.heart');

  let best = 0;
  let gameState = 'start'; // start | playing | over
  let frame = 0;
  let score = 0;
  let hp = 5;
  let shake = 0, flash = 0;
  let rot = 0;

  let enemies = [];
  let particles = [];
  const stars = [];
  for (let i=0;i<45;i++){
    stars.push({x:Math.random(), y:Math.random(), r:Math.random()*1.2+0.3, tw:Math.random()*Math.PI*2});
  }

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function pad(n){ return String(n).padStart(3,'0'); }

  function updateHearts(){ hearts.forEach((h,i)=> h.classList.toggle('lost', i>=hp)); }

  let spawnTimer=0, nextSpawn=70;

  function resetGame(){
    score=0; hp=5; frame=0; enemies=[]; particles=[];
    spawnTimer=0; nextSpawn=70;
    scoreEl.textContent='000';
    waveEl.textContent='ONDA 1';
    updateHearts();
  }

  function startGame(){
    resetGame();
    gameState='playing';
    overlay.style.display='none';
  }

  function endGame(){
    gameState='over';
    shake=14; flash=1;
    if (score>best){ best=score; bestEl.textContent='MELHOR '+pad(best); }
    overlay.querySelector('.big').textContent = 'O cristal se estilhaçou!';
    overlay.querySelector('.small').textContent = 'pontos: '+score+' · toque para tentar de novo';
    overlay.style.display='flex';
  }

  overlay.addEventListener('touchstart', e=>{ e.preventDefault(); tapStart(); }, {passive:false});
  overlay.addEventListener('mousedown', tapStart);
  function tapStart(){
    if (gameState==='start' || gameState==='over') startGame();
  }

  function canvasPos(clientX,clientY){
    const rect = canvas.getBoundingClientRect();
    return { x:(clientX-rect.left)/rect.width*W, y:(clientY-rect.top)/rect.height*H };
  }

  function tryHit(x,y){
    let bestEn = null, bestD = Infinity;
    enemies.forEach(en=>{
      if (en.dead) return;
      const d = Math.hypot(x-en.x, y-en.y);
      if (d < en.r+12 && d<bestD){ bestD=d; bestEn=en; }
    });
    if (bestEn) hitEnemy(bestEn);
  }

  canvas.addEventListener('touchstart', e=>{
    e.preventDefault();
    if (gameState!=='playing') return;
    for (const t of e.changedTouches){
      const p = canvasPos(t.clientX,t.clientY);
      tryHit(p.x,p.y);
    }
  }, {passive:false});
  canvas.addEventListener('mousedown', e=>{
    if (gameState!=='playing') return;
    const p = canvasPos(e.clientX,e.clientY);
    tryHit(p.x,p.y);
  });

  function hitEnemy(en){
    en.hp--;
    en.hitFlash = 8;
    if (en.hp<=0){
      en.dead = true;
      score += en.value;
      scoreEl.textContent = pad(score);
      spawnBurst(en.x,en.y,en.glow,10);
    } else {
      spawnBurst(en.x,en.y,en.glow,4);
    }
  }

  function spawnBurst(x,y,color,n){
    for (let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=0.8+Math.random()*2.2;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:22,color});
    }
  }

  function spawnEnemy(){
    const t = frame/60;
    const angle = Math.random()*Math.PI*2;
    const r = Math.random();
    let type = 'basic';
    if (t>25 && r<0.22) type='heavy';
    else if (t>12 && r<0.5) type='fast';

    const sx = center.x+Math.cos(angle)*spawnRadius;
    const sy = center.y+Math.sin(angle)*spawnRadius;
    const dx = -Math.cos(angle), dy = -Math.sin(angle);

    let en;
    if (type==='heavy'){
      en = { x:sx,y:sy, dx,dy, r:17, hp:2, maxHp:2, speed:Math.min(0.75,0.36+t*0.006), value:3, glow:'192,38,211', color:'#3a1030', type };
    } else if (type==='fast'){
      en = { x:sx,y:sy, dx,dy, r:9, hp:1, maxHp:1, speed:Math.min(2.1,1.3+t*0.01), value:2, glow:'248,113,113', color:'#2a0f14', type };
    } else {
      en = { x:sx,y:sy, dx,dy, r:12, hp:1, maxHp:1, speed:Math.min(1.5,0.6+t*0.012), value:1, glow:'167,58,200', color:'#1c0f28', type };
    }
    en.hitFlash = 0; en.dead=false; en.trail=[];
    enemies.push(en);
  }

  function update(){
    frame++;
    rot += 0.004;
    const t = frame/60;
    waveEl.textContent = 'ONDA ' + (1+Math.floor(t/15));

    spawnTimer++;
    if (spawnTimer>nextSpawn){
      spawnEnemy();
      spawnTimer=0;
      nextSpawn = Math.max(20, 68 - t*1.1) + Math.random()*14;
    }

    enemies.forEach(en=>{
      if (en.dead) return;
      if (en.type==='fast'){
        en.trail.push({x:en.x,y:en.y,life:10});
      }
      en.x += en.dx*en.speed;
      en.y += en.dy*en.speed;
      if (en.hitFlash>0) en.hitFlash--;
      const dC = Math.hypot(en.x-center.x, en.y-center.y);
      if (dC < crystalR+en.r*0.5){
        en.dead = true;
        hp--; updateHearts();
        shake=9; flash=0.8;
        spawnBurst(center.x,center.y,'251,191,36',10);
        if (hp<=0) endGame();
      }
      if (en.trail){ en.trail.forEach(p=>p.life--); en.trail = en.trail.filter(p=>p.life>0); }
    });
    enemies = enemies.filter(en=>!en.dead);

    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.04; p.life--; });
    particles = particles.filter(p=>p.life>0);

    if (shake>0) shake-=0.6;
    if (flash>0) flash-=0.05;
  }

  function drawBackground(){
    const g = ctx.createRadialGradient(center.x,center.y,10,center.x,center.y,W*0.75);
    g.addColorStop(0,'#1a1428');
    g.addColorStop(0.6,'#100c1c');
    g.addColorStop(1,'#07060d');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    stars.forEach(s=>{
      const a = 0.25+Math.sin(frame*0.02+s.tw)*0.25;
      ctx.fillStyle = `rgba(255,240,210,${Math.max(0,a)})`;
      ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2); ctx.fill();
    });

    ctx.strokeStyle = 'rgba(251,191,36,0.08)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(center.x,center.y,spawnRadius,0,Math.PI*2); ctx.stroke();
  }

  function drawCrystal(){
    ctx.save();
    ctx.translate(center.x,center.y);
    const pulse = 4+Math.sin(frame*0.07)*2.4;
    const glow = ctx.createRadialGradient(0,0,4,0,0,crystalR+18+pulse);
    glow.addColorStop(0,'rgba(251,191,36,0.5)');
    glow.addColorStop(1,'rgba(251,191,36,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0,0,crystalR+18+pulse,0,Math.PI*2); ctx.fill();

    ctx.rotate(rot);
    const sides = 7;
    const hueShift = ['#fde68a','#fbbf24','#f59e0b','#fcd34d'];
    for (let i=0;i<sides;i++){
      const a0 = (Math.PI*2/sides)*i, a1=(Math.PI*2/sides)*(i+1);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a0)*crystalR, Math.sin(a0)*crystalR);
      ctx.lineTo(Math.cos(a1)*crystalR, Math.sin(a1)*crystalR);
      ctx.closePath();
      ctx.fillStyle = hueShift[i%hueShift.length];
      ctx.globalAlpha = 0.85;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0,0,crystalR,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  function drawEnemy(en){
    if (en.type==='fast' && en.trail){
      en.trail.forEach(p=>{
        ctx.fillStyle = `rgba(${en.glow},${Math.max(0,p.life/10*0.4)})`;
        ctx.beginPath(); ctx.arc(p.x,p.y,en.r*0.6,0,Math.PI*2); ctx.fill();
      });
    }
    const flashOn = en.hitFlash>0 && Math.floor(en.hitFlash/2)%2===0;
    ctx.save();
    ctx.translate(en.x,en.y);
    ctx.shadowColor = `rgba(${en.glow},0.8)`;
    ctx.shadowBlur = 9;
    ctx.fillStyle = flashOn ? '#ffffff' : en.color;
    const n = en.type==='heavy' ? 7 : 6;
    ctx.beginPath();
    for (let i=0;i<n;i++){
      const ang = (Math.PI*2/n)*i;
      const rad = en.r*(0.82+ (i%2===0?0.18:0));
      const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle = `rgba(${en.glow},0.7)`;
    ctx.lineWidth = 1.4;
    ctx.stroke();
    if (en.type==='heavy' && en.hp<en.maxHp){
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-en.r*0.5,-en.r*0.3); ctx.lineTo(en.r*0.3,en.r*0.5); ctx.stroke();
    }
    ctx.restore();
  }

  function render(){
    ctx.save();
    if (shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    ctx.clearRect(-20,-20,W+40,H+40);
    drawBackground();
    drawCrystal();
    enemies.forEach(drawEnemy);

    particles.forEach(p=>{
      ctx.fillStyle = `rgba(${p.color},${Math.max(0,p.life/22)})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.2,0,Math.PI*2); ctx.fill();
    });

    if (flash>0){
      ctx.fillStyle = `rgba(255,90,90,${flash*0.3})`;
      ctx.fillRect(0,0,W,H);
    }
    ctx.restore();
  }

  function loop(){
    if (gameState==='playing') update();
    render();
    requestAnimationFrame(loop);
  }

  render();
  loop();
})();
</script>
</body>
</html>
