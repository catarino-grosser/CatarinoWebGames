<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Guardião do Cristal</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body {
    height:100%;
    background: #060814;
    overflow:hidden;
    touch-action: manipulation;
  }
  body {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #wrap {
    width:100%;
    max-width:400px;
    padding:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  h1 {
    color:#cfe2ff;
    font-size:14px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:600;
    opacity:0.85;
  }
  #stage {
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(96,165,250,0.2), 0 20px 60px -20px rgba(0,0,0,0.85);
  }
  canvas {
    display:block;
    width:100%;
    height:auto;
    background:#060814;
  }
  #hud {
    position:absolute;
    top:10px;
    left:0; right:0;
    display:flex;
    flex-direction:column;
    gap:6px;
    pointer-events:none;
  }
  .hud-row {
    display:flex;
    justify-content:space-between;
    padding:0 14px;
    font-family:'Courier New', monospace;
    font-weight:700;
    font-size:14px;
    color:#dce8ff;
    text-shadow:0 0 8px rgba(96,165,250,0.5);
  }
  #shards { display:flex; gap:5px; justify-content:center; }
  .shard {
    width:10px; height:10px;
    background:#60a5fa;
    box-shadow:0 0 7px rgba(96,165,250,0.8);
    transform:rotate(45deg);
  }
  .shard.lost { background:transparent; border:1.5px solid rgba(255,255,255,0.22); box-shadow:none; }
  #overlay {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:rgba(6,8,20,0.5);
    color:#eaf1ff;
    text-align:center;
    padding:22px;
  }
  #overlay .big { font-size:18px; font-weight:700; letter-spacing:0.03em; }
  #overlay .small { font-size:12px; opacity:0.75; font-family:'Courier New', monospace; max-width:260px; }
  #hint { color:#4a5063; font-size:12px; letter-spacing:0.04em; text-align:center; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Guardião do Cristal</h1>
  <div id="stage">
    <canvas id="game" width="360" height="360"></canvas>
    <div id="hud">
      <div class="hud-row">
        <span id="score">000</span>
        <span id="wave">ONDA 1</span>
      </div>
      <div id="shards">
        <div class="shard"></div><div class="shard"></div><div class="shard"></div>
        <div class="shard"></div><div class="shard"></div>
      </div>
    </div>
    <div id="overlay">
      <div class="big">Guardião do Cristal</div>
      <div class="small">toque nas sombras antes que alcancem o cristal no centro</div>
    </div>
  </div>
  <div id="hint">toque nos inimigos para destruí-los</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const center = {x:W/2, y:H/2};
  const arenaR = 148;
  const crystalR = 20;

  const scoreEl = document.getElementById('score');
  const waveEl = document.getElementById('wave');
  const shards = document.querySelectorAll('.shard');
  const overlay = document.getElementById('overlay');

  let best = 0;
  let gameState = 'start'; // start | playing | defeat
  let frame = 0;
  let score = 0;
  let shake = 0, flash = 0;

  const crystal = { hp:5, maxHp:5, flashT:0 };
  let enemies = [];
  let particles = [];
  let spawnTimer = 0;

  const dust = [];
  for (let i=0;i<24;i++){
    dust.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+0.4,tw:Math.random()*Math.PI*2});
  }

  const TYPES = {
    shadow: { r:10, hp:1, speed:0.9, color:'#7c3aed', points:1 },
    swift:  { r:8,  hp:1, speed:1.9, color:'#38bdf8', points:2 },
    brute:  { r:15, hp:2, speed:0.55, color:'#b45309', points:3 }
  };

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function elapsedSec(){ return frame/60; }

  function resetGame(){
    crystal.hp = 5; crystal.flashT=0;
    enemies = []; particles = [];
    score = 0; frame = 0; spawnTimer = 0;
    scoreEl.textContent = '000';
    waveEl.textContent = 'ONDA 1';
    updateShards();
  }

  function startGame(){
    resetGame();
    gameState = 'playing';
    overlay.style.display = 'none';
  }

  function triggerDefeat(){
    gameState = 'defeat';
    shake = 16; flash = 1;
    if (score>best){ best = score; }
    overlay.querySelector('.big').textContent = 'O cristal se estilhaçou!';
    overlay.querySelector('.small').textContent = 'pontos: ' + score + ' · melhor: ' + best + ' · toque para tentar de novo';
    overlay.style.display = 'flex';
  }

  function updateShards(){
    shards.forEach((s,i)=> s.classList.toggle('lost', i>=crystal.hp));
  }

  function spawnBurst(x,y,color,n=10){
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, sp = 1+Math.random()*2.4;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:24,color});
    }
  }

  function pickType(t){
    const canSwift = t>12, canBrute = t>25;
    const r = Math.random();
    if (canBrute && r<0.15) return 'brute';
    if (canSwift && r<0.40) return 'swift';
    return 'shadow';
  }

  function spawnEnemy(){
    const t = elapsedSec();
    const typeKey = pickType(t);
    const def = TYPES[typeKey];
    const angle = Math.random()*Math.PI*2;
    const x = center.x+Math.cos(angle)*arenaR;
    const y = center.y+Math.sin(angle)*arenaR;
    const dx = center.x-x, dy = center.y-y;
    const d = Math.hypot(dx,dy);
    const speedMult = 1+t*0.012;
    enemies.push({
      x,y, vx:dx/d, vy:dy/d, speed:def.speed*speedMult,
      r:def.r, hp:def.hp, maxHp:def.hp, color:def.color, points:def.points,
      hitT:0
    });
  }

  // ---------- input ----------
  function canvasPos(clientX,clientY){
    const rect = canvas.getBoundingClientRect();
    return { x:(clientX-rect.left)/rect.width*W, y:(clientY-rect.top)/rect.height*H };
  }
  function handleTap(clientX,clientY){
    if (gameState!=='playing') return;
    const p = canvasPos(clientX,clientY);
    let best=null, bestD=Infinity;
    enemies.forEach(en=>{
      const d = Math.hypot(p.x-en.x,p.y-en.y);
      if (d < en.r+8 && d<bestD){ best=en; bestD=d; }
    });
    if (best) onEnemyTap(best);
  }
  function onEnemyTap(en){
    en.hp--;
    en.hitT = 10;
    if (en.hp<=0){
      score += en.points;
      scoreEl.textContent = String(score).padStart(3,'0');
      spawnBurst(en.x,en.y,en.color);
      en.dead = true;
    }
  }

  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.touches[0]; handleTap(t.clientX,t.clientY); }, {passive:false});
  canvas.addEventListener('mousedown', e=> handleTap(e.clientX,e.clientY));
  overlay.addEventListener('touchstart', e=>{ e.preventDefault(); tapStart(); }, {passive:false});
  overlay.addEventListener('mousedown', tapStart);
  function tapStart(){
    if (gameState==='start' || gameState==='defeat') startGame();
  }

  // ---------- update ----------
  function update(){
    frame++;
    const t = elapsedSec();
    waveEl.textContent = 'ONDA ' + (1+Math.floor(t/20));

    spawnTimer++;
    const interval = Math.max(16, 68 - t*0.7);
    if (spawnTimer > interval){ spawnEnemy(); spawnTimer = 0; }

    enemies.forEach(en=>{
      en.x += en.vx*en.speed;
      en.y += en.vy*en.speed;
      if (en.hitT>0) en.hitT--;
      const d = Math.hypot(center.x-en.x, center.y-en.y);
      if (d <= crystalR+en.r){
        crystal.hp--;
        crystal.flashT = 20;
        shake = 8; flash = 0.6;
        spawnBurst(en.x,en.y,'96,165,250',8);
        en.dead = true;
        updateShards();
        if (crystal.hp<=0) triggerDefeat();
      }
    });
    enemies = enemies.filter(en=>!en.dead);

    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--; });
    particles = particles.filter(p=>p.life>0);

    if (crystal.flashT>0) crystal.flashT--;
    if (shake>0) shake-=0.6;
    if (flash>0) flash-=0.05;
  }

  // ---------- render ----------
  function drawBackground(){
    const g = ctx.createRadialGradient(center.x,center.y,10,center.x,center.y,arenaR+60);
    g.addColorStop(0,'#12183a');
    g.addColorStop(0.6,'#0a0e24');
    g.addColorStop(1,'#060814');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    dust.forEach(d=>{
      const a = 0.2+Math.sin(frame*0.02+d.tw)*0.2;
      ctx.fillStyle = `rgba(180,200,255,${Math.max(0,a)})`;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill();
    });

    ctx.strokeStyle = 'rgba(96,165,250,0.16)';
    ctx.lineWidth = 1.4;
    ctx.setLineDash([6,8]);
    ctx.beginPath(); ctx.arc(center.x,center.y,arenaR,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawCrystal(){
    const hpFrac = crystal.hp/crystal.maxHp;
    const color = hpFrac>0.5 ? '#93c5fd' : (hpFrac>0.25 ? '#fbbf24' : '#f87171');
    ctx.save();
    if (crystal.flashT>0 && Math.floor(crystal.flashT/3)%2===0) ctx.globalAlpha = 0.4;
    ctx.translate(center.x,center.y);

    for (let i=0;i<3;i++){
      const ang = frame*0.012 + i*(Math.PI*2/3);
      const orbitR = crystalR+16;
      const ox = Math.cos(ang)*orbitR, oy = Math.sin(ang)*orbitR;
      ctx.fillStyle = 'rgba(147,197,253,0.55)';
      ctx.beginPath(); ctx.arc(ox,oy,2.2,0,Math.PI*2); ctx.fill();
    }

    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0,-crystalR);
    ctx.lineTo(crystalR*0.72,0);
    ctx.lineTo(0,crystalR);
    ctx.lineTo(-crystalR*0.72,0);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0,-crystalR); ctx.lineTo(0,crystalR);
    ctx.moveTo(-crystalR*0.72,0); ctx.lineTo(crystalR*0.72,0);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  function drawEnemy(en){
    ctx.save();
    ctx.translate(en.x,en.y);
    if (en.hitT>0){ ctx.scale(1.15,1.15); }
    ctx.shadowColor = en.color;
    ctx.shadowBlur = 9;
    ctx.fillStyle = '#0c0e18';
    ctx.beginPath(); ctx.arc(0,0,en.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = en.color;
    ctx.lineWidth = 1.8;
    ctx.stroke();
    if (en.maxHp>1){
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      const frac = en.hp/en.maxHp;
      ctx.arc(0,0,en.r-3,-Math.PI/2,-Math.PI/2+Math.PI*2*frac);
      ctx.stroke();
    }
    if (en.hitT>0){
      ctx.fillStyle = `rgba(255,255,255,${en.hitT/10*0.5})`;
      ctx.beginPath(); ctx.arc(0,0,en.r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function render(){
    ctx.save();
    if (shake>0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    ctx.clearRect(-20,-20,W+40,H+40);
    drawBackground();
    drawCrystal();
    enemies.forEach(drawEnemy);

    particles.forEach(p=>{
      ctx.fillStyle = `rgba(${p.color},${Math.max(0,p.life/24)})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.2,0,Math.PI*2); ctx.fill();
    });

    if (flash>0){
      ctx.fillStyle = `rgba(255,90,90,${flash*0.3})`;
      ctx.fillRect(0,0,W,H);
    }
    ctx.restore();
  }

  function loop(){
    if (gameState==='playing') update();
    render();
    requestAnimationFrame(loop);
  }

  render();
  loop();
})();
</script>
</body>
</html>
