<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Duelo de Feitiços</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body {
    height:100%;
    background: #08050f;
    overflow:hidden;
    touch-action: manipulation;
  }
  body {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #wrap {
    width:100%;
    max-width:420px;
    padding:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  h1 {
    color:#f5d6ff;
    font-size:14px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:600;
    opacity:0.85;
  }
  #stage {
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(232,121,249,0.2), 0 20px 60px -20px rgba(0,0,0,0.85);
  }
  canvas {
    display:block;
    width:100%;
    height:auto;
    background:#08050f;
  }
  #overlay {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:rgba(8,5,15,0.55);
    color:#f8ecff;
    text-align:center;
    padding:24px;
  }
  #overlay .big { font-size:18px; font-weight:700; letter-spacing:0.03em; }
  #overlay .small { font-size:12px; opacity:0.75; font-family:'Courier New', monospace; max-width:270px; }
  #hint { color:#514a5c; font-size:12px; letter-spacing:0.04em; text-align:center; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Duelo de Feitiços</h1>
  <div id="stage">
    <canvas id="game" width="380" height="340"></canvas>
    <div id="overlay">
      <div class="big">Duelo de Feitiços</div>
      <div class="small">observe a sequência de runas e toque nelas na mesma ordem antes do tempo acabar</div>
    </div>
  </div>
  <div id="hint">toque nas runas na ordem mostrada</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const overlay = document.getElementById('overlay');

  const RUNES = [
    { name:'Fogo',   color:'#fb923c', shape:'triangle' },
    { name:'Água',   color:'#38bdf8', shape:'circle' },
    { name:'Terra',  color:'#4ade80', shape:'square' },
    { name:'Vento',  color:'#e5e7eb', shape:'diamond' },
    { name:'Arcano', color:'#c084fc', shape:'star' }
  ];
  const runeXs = [70,130,190,250,310];
  const runeY = 178, runeR = 22;

  const opponentPos = {x:190,y:60};
  const playerPos = {x:190,y:266};
  const oppHPBar = {x:100,y:18,w:180,h:8};
  const plyHPBar = {x:100,y:314,w:180,h:8};
  const timerBar = {x:110,y:216,w:160,h:6};
  const dotsY = 132;
  const statusY = 108;

  const BASE_LEN = 3, MAX_LEN = 9;
  const SHOW_ON = 26, SHOW_GAP = 12, RESOLVE_FRAMES = 40;

  let gameState = 'start'; // start | showing | input | resolve | win | defeat
  let frame = 0;
  let player = { hp:100, maxHp:100, flashT:0 };
  let opponent = { hp:100, maxHp:100, flashT:0 };
  let winStreak = 0;
  let sequence = [];
  let inputIndex = 0;
  let highlighted = -1;
  let showIndex = 0, showTimer = 0, showPhase = 'on';
  let inputTimer = 0, inputTotal = 0;
  let resolve = null;
  let particles = [];
  let projectile = null;
  let shake = 0, flash = 0;
  let flashRune = -1, flashRuneT = 0, flashOk = true;
  let status = '';

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function rand(a,b){ return a+Math.random()*(b-a); }

  function resetGame(){
    player.hp = 100; opponent.hp = 100;
    winStreak = 0; particles = []; projectile = null;
    resolve = null; shake=0; flash=0;
  }

  function startDuel(){
    resetGame();
    gameState = 'showing';
    startRound();
  }

  function seqLength(){ return Math.min(MAX_LEN, BASE_LEN+winStreak); }

  function startRound(){
    const len = seqLength();
    sequence = [];
    for (let i=0;i<len;i++) sequence.push(Math.floor(Math.random()*RUNES.length));
    inputIndex = 0;
    showIndex = 0; showPhase='on'; showTimer = SHOW_ON;
    highlighted = sequence[0];
    gameState = 'showing';
    status = 'Observe a sequência...';
  }

  function beginInput(){
    gameState = 'input';
    highlighted = -1;
    const perSymbol = Math.max(0.72, 1.28 - winStreak*0.035);
    inputTotal = Math.round(sequence.length*perSymbol*60);
    inputTimer = inputTotal;
    status = 'Sua vez! Repita a sequência';
  }

  function castSuccess(){
    const dmg = 9 + sequence.length*2;
    resolve = { type:'success', damage:dmg, timer:RESOLVE_FRAMES, applied:false };
    projectile = { x:playerPos.x, y:playerPos.y-14, tx:opponentPos.x, ty:opponentPos.y+14, color:'#e879f9' };
    winStreak++;
    gameState = 'resolve';
    status = 'Feitiço conjurado!';
  }
  function castFail(){
    const dmg = rand(11,18);
    resolve = { type:'fail', damage:dmg, timer:RESOLVE_FRAMES, applied:false };
    projectile = { x:opponentPos.x, y:opponentPos.y+14, tx:playerPos.x, ty:playerPos.y-14, color:'#a21caf' };
    winStreak = 0;
    gameState = 'resolve';
    status = 'Contra-ataque sombrio!';
  }

  function triggerWin(){
    gameState = 'win';
    overlay.querySelector('.big').textContent = 'Vitória arcana!';
    overlay.querySelector('.small').textContent = 'você derrotou o Feiticeiro Sombrio · toque para duelar de novo';
    overlay.style.display='flex';
  }
  function triggerDefeat(){
    gameState = 'defeat';
    overlay.querySelector('.big').textContent = 'Você foi derrotado...';
    overlay.querySelector('.small').textContent = 'o feiticeiro sombrio venceu este duelo · toque para tentar de novo';
    overlay.style.display='flex';
  }

  function spawnBurst(x,y,color){
    for (let i=0;i<12;i++){
      const a = Math.random()*Math.PI*2, sp = 1+Math.random()*2.4;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:24,color});
    }
  }

  // ---------- input ----------
  function canvasPos(clientX,clientY){
    const rect = canvas.getBoundingClientRect();
    return {
      x:(clientX-rect.left)/rect.width*W,
      y:(clientY-rect.top)/rect.height*H
    };
  }
  function handleTap(clientX,clientY){
    if (gameState!=='input') return;
    const p = canvasPos(clientX,clientY);
    for (let i=0;i<runeXs.length;i++){
      const d = Math.hypot(p.x-runeXs[i], p.y-runeY);
      if (d < runeR+6){
        onRuneTap(i);
        return;
      }
    }
  }
  function onRuneTap(i){
    flashRune = i; flashRuneT = 14;
    if (i === sequence[inputIndex]){
      flashOk = true;
      inputIndex++;
      if (inputIndex >= sequence.length) castSuccess();
    } else {
      flashOk = false;
      castFail();
    }
  }

  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.touches[0]; handleTap(t.clientX,t.clientY); }, {passive:false});
  canvas.addEventListener('mousedown', e=> handleTap(e.clientX,e.clientY));
  overlay.addEventListener('touchstart', e=>{ e.preventDefault(); tapStart(); }, {passive:false});
  overlay.addEventListener('mousedown', tapStart);
  function tapStart(){
    if (gameState==='start' || gameState==='win' || gameState==='defeat'){
      overlay.style.display='none';
      startDuel();
    }
  }

  // ---------- update ----------
  function update(){
    frame++;
    if (flashRuneT>0) flashRuneT--;
    if (shake>0) shake-=0.6;
    if (flash>0) flash-=0.05;
    if (player.flashT>0) player.flashT--;
    if (opponent.flashT>0) opponent.flashT--;

    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--; });
    particles = particles.filter(p=>p.life>0);

    if (gameState==='showing'){
      showTimer--;
      if (showTimer<=0){
        if (showPhase==='on'){
          showPhase='gap'; showTimer=SHOW_GAP; highlighted=-1;
        } else {
          showIndex++;
          if (showIndex>=sequence.length){ beginInput(); }
          else { showPhase='on'; showTimer=SHOW_ON; highlighted=sequence[showIndex]; }
        }
      }
    } else if (gameState==='input'){
      inputTimer--;
      if (inputTimer<=0) castFail();
    } else if (gameState==='resolve'){
      resolve.timer--;
      const t = clamp((RESOLVE_FRAMES-resolve.timer)/20, 0, 1);
      if (projectile){
        projectile.x = projectile.x + (projectile.tx-projectile.x)*0.001; // placeholder, real interp below
      }
      if (t>=1 && !resolve.applied){
        resolve.applied = true;
        if (resolve.type==='success'){
          opponent.hp = clamp(opponent.hp-resolve.damage,0,opponent.maxHp);
          opponent.flashT = 16; shake=6; flash=0.6;
          spawnBurst(opponentPos.x,opponentPos.y,'232,121,249');
        } else {
          player.hp = clamp(player.hp-resolve.damage,0,player.maxHp);
          player.flashT = 16; shake=8; flash=0.8;
          spawnBurst(playerPos.x,playerPos.y,'162,28,172');
        }
        projectile = null;
      }
      if (resolve.timer<=0){
        if (opponent.hp<=0) triggerWin();
        else if (player.hp<=0) triggerDefeat();
        else startRound();
      }
    }
  }

  // ---------- render ----------
  function drawBackground(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#150a28');
    g.addColorStop(0.5,'#0e0620');
    g.addColorStop(1,'#08050f');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    for (let i=0;i<3;i++){
      const cx = W*(0.2+i*0.3), cy = 90+Math.sin(frame*0.01+i)*10;
      const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,90);
      grad.addColorStop(0,'rgba(168,85,247,0.08)');
      grad.addColorStop(1,'rgba(168,85,247,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx,cy,90,0,Math.PI*2); ctx.fill();
    }
  }

  function drawHPBar(bar, val, maxVal, color){
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(bar.x,bar.y,bar.w,bar.h);
    ctx.fillStyle = color;
    ctx.fillRect(bar.x,bar.y,bar.w*clamp(val/maxVal,0,1),bar.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bar.x+0.5,bar.y+0.5,bar.w-1,bar.h-1);
  }

  function drawWizard(pos, color, flashT, hatUp){
    ctx.save();
    if (flashT>0 && Math.floor(flashT/3)%2===0) ctx.globalAlpha = 0.35;
    ctx.translate(pos.x,pos.y);
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#100a1a';
    ctx.beginPath();
    ctx.moveTo(-16,26); ctx.lineTo(16,26); ctx.lineTo(9,-4); ctx.lineTo(-9,-4);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6;
    ctx.stroke();

    ctx.shadowColor = color; ctx.shadowBlur = 8;
    ctx.fillStyle = '#160f22';
    ctx.beginPath(); ctx.arc(0,-10,8,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.stroke();

    const hatDir = hatUp ? -1 : 1;
    ctx.fillStyle = '#100a1a';
    ctx.beginPath();
    ctx.moveTo(-11,-16); ctx.lineTo(11,-16); ctx.lineTo(0,-16+hatDir*22);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.stroke();

    ctx.fillStyle = color;
    ctx.globalAlpha = (flashT>0 ? ctx.globalAlpha : 1) * (0.7+Math.sin(frame*0.1)*0.3);
    ctx.beginPath(); ctx.arc(0,10,3.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawRuneShape(x,y,r,shape,color,alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x,y);
    ctx.fillStyle = color;
    ctx.beginPath();
    if (shape==='triangle'){
      ctx.moveTo(0,-r); ctx.lineTo(r*0.87,r*0.6); ctx.lineTo(-r*0.87,r*0.6); ctx.closePath();
    } else if (shape==='circle'){
      ctx.arc(0,0,r*0.75,0,Math.PI*2);
    } else if (shape==='square'){
      ctx.rect(-r*0.62,-r*0.62,r*1.24,r*1.24);
    } else if (shape==='diamond'){
      ctx.moveTo(0,-r); ctx.lineTo(r*0.75,0); ctx.lineTo(0,r); ctx.lineTo(-r*0.75,0); ctx.closePath();
    } else if (shape==='star'){
      for (let i=0;i<10;i++){
        const ang = Math.PI/5*i - Math.PI/2;
        const rad = i%2===0 ? r*0.8 : r*0.34;
        const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
        if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
    }
    ctx.fill();
    ctx.restore();
  }

  function drawRunes(){
    RUNES.forEach((r,i)=>{
      const x = runeXs[i];
      const isHi = highlighted===i;
      const isFlash = flashRune===i && flashRuneT>0;
      ctx.save();
      ctx.shadowColor = r.color;
      ctx.shadowBlur = isHi ? 38 : 6;
      ctx.fillStyle = isHi ? r.color : 'rgba(255,255,255,0.03)';
      ctx.globalAlpha = isHi ? 0.4 : 1;
      ctx.beginPath(); ctx.arc(x,runeY,runeR+4,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = isFlash ? (flashOk ? '#4ade80' : '#f87171') : (isHi ? r.color : 'rgba(255,255,255,0.15)');
      ctx.lineWidth = isFlash ? 3 : (isHi ? 3 : 1.4);
      ctx.beginPath(); ctx.arc(x,runeY,runeR+4,0,Math.PI*2); ctx.stroke();
      ctx.restore();
      drawRuneShape(x,runeY,runeR*(isHi?0.78:0.62),r.shape,r.color, isHi?1:0.55);
    });
  }

  function drawProgressDots(){
    if (gameState!=='input' && gameState!=='showing') return;
    const len = sequence.length;
    const spacing = 14;
    const startX = W/2 - (len-1)*spacing/2;
    for (let i=0;i<len;i++){
      const filled = gameState==='input' ? i<inputIndex : i<=showIndex && showPhase==='gap' || (gameState==='showing' && i<showIndex);
      ctx.fillStyle = filled ? '#e879f9' : 'rgba(255,255,255,0.18)';
      ctx.beginPath(); ctx.arc(startX+i*spacing, dotsY, 3.2, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawTimerBar(){
    if (gameState!=='input') return;
    const frac = clamp(inputTimer/inputTotal,0,1);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(timerBar.x,timerBar.y,timerBar.w,timerBar.h);
    ctx.fillStyle = frac<0.3 ? '#f87171' : '#e879f9';
    ctx.fillRect(timerBar.x,timerBar.y,timerBar.w*frac,timerBar.h);
  }

  function drawStatus(){
    ctx.fillStyle = 'rgba(245,214,255,0.75)';
    ctx.font = '600 12px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(status, W/2, statusY);
  }

  function drawProjectile(){
    if (!projectile || !resolve) return;
    const t = clamp((RESOLVE_FRAMES-resolve.timer)/20,0,1);
    const x = projectile.x + (projectile.tx-projectile.x)*t;
    const y = projectile.y + (projectile.ty-projectile.y)*t;
    ctx.save();
    ctx.shadowColor = projectile.color;
    ctx.shadowBlur = 14;
    ctx.fillStyle = projectile.color;
    ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function render(){
    ctx.save();
    if (shake>0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    ctx.clearRect(-20,-20,W+40,H+40);
    drawBackground();

    drawHPBar(oppHPBar, opponent.hp, opponent.maxHp, '#a21caf');
    drawHPBar(plyHPBar, player.hp, player.maxHp, '#5eead4');

    drawWizard(opponentPos, '#a21caf', opponent.flashT, false);
    drawWizard(playerPos, '#5eead4', player.flashT, true);

    if (gameState!=='start'){
      drawStatus();
      drawProgressDots();
      drawRunes();
      drawTimerBar();
    }
    drawProjectile();

    particles.forEach(p=>{
      ctx.fillStyle = `rgba(${p.color},${Math.max(0,p.life/24)})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.2,0,Math.PI*2); ctx.fill();
    });

    if (flash>0){
      ctx.fillStyle = `rgba(255,255,255,${flash*0.12})`;
      ctx.fillRect(0,0,W,H);
    }
    ctx.restore();
  }

  function loop(){
    if (gameState!=='start') update();
    render();
    requestAnimationFrame(loop);
  }

  render();
  loop();
})();
</script>
</body>
</html>
