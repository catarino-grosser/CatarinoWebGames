<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rodovia Noturna</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height:100%;
    background: #05040a;
    overflow:hidden;
    touch-action: manipulation;
  }
  body {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #wrap {
    width:100%;
    max-width:380px;
    padding:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  h1 {
    color:#8fe9ff;
    font-size:14px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:600;
    opacity:0.85;
  }
  #stage {
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(140,230,255,0.16), 0 20px 60px -20px rgba(0,0,0,0.85);
  }
  canvas {
    display:block;
    width:100%;
    height:auto;
    background:#05040a;
  }
  #hud {
    position:absolute;
    top:10px;
    left:0; right:0;
    display:flex;
    justify-content:space-between;
    padding:0 14px;
    font-family: 'Courier New', monospace;
    font-weight:700;
    font-size:14px;
    color:#d9f7ff;
    text-shadow: 0 0 8px rgba(120,220,255,0.5);
    pointer-events:none;
  }
  #overlay {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:rgba(5,4,10,0.4);
    color:#e8fbff;
    text-align:center;
    padding:20px;
  }
  #overlay .big {
    font-size:18px;
    font-weight:700;
    letter-spacing:0.03em;
  }
  #overlay .small {
    font-size:12px;
    opacity:0.75;
    font-family: 'Courier New', monospace;
  }
  #zones {
    position:absolute;
    inset:0;
    display:flex;
    pointer-events:none;
  }
  #hint {
    color:#5c6a7c;
    font-size:12px;
    letter-spacing:0.04em;
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>Rodovia Noturna</h1>
  <div id="stage">
    <canvas id="game" width="320" height="500"></canvas>
    <div id="hud">
      <span id="score">000</span>
      <span id="best">MELHOR 000</span>
    </div>
    <div id="overlay">
      <div class="big">Toque para começar</div>
      <div class="small">esquerda / direita da tela para mudar de faixa</div>
    </div>
  </div>
  <div id="hint">toque nos lados · setas ← → no computador</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');

  const horizonY = 78;
  const bottomY = H - 26;
  const topHalfWidth = 10;
  const bottomHalfWidth = 118;
  const laneU = [-2/3, 0, 2/3];

  let best = 0;
  let state = 'ready';
  let frame = 0;
  let distance = 0;
  let enemySpeedBase = 2.6;
  let spawnTimer = 0;
  let nextSpawn = 55;
  let shake = 0;
  let flash = 0;

  const player = {
    lane: 1,
    u: laneU[1],
    y: bottomY - 44,
    color: '#4dd8ff'
  };

  let enemies = [];
  let particles = [];

  const buildings = [];
  for (let i=0;i<16;i++){
    buildings.push({
      x: Math.random()*W,
      w: 14 + Math.random()*22,
      h: 14 + Math.random()*38,
      lit: Math.random()<0.5
    });
  }
  const stars = [];
  for (let i=0;i<26;i++){
    stars.push({x: Math.random()*W, y: Math.random()*horizonY*0.8, r: Math.random()*1.2+0.3, tw: Math.random()*Math.PI*2});
  }

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function lerp(a,b,t){ return a+(b-a)*t; }

  function tAt(y){ return clamp((y - horizonY)/(bottomY - horizonY), 0, 1); }
  function halfWidthAt(y){ const t = tAt(y); return lerp(topHalfWidth, bottomHalfWidth, t); }
  function scaleAt(y){ const t = tAt(y); return lerp(0.22, 1, t); }
  function projectX(u, y){ return W/2 + u*halfWidthAt(y); }

  function resetGame(){
    enemies = [];
    particles = [];
    distance = 0;
    frame = 0;
    spawnTimer = 0;
    nextSpawn = 55;
    enemySpeedBase = 2.6;
    player.lane = 1;
    player.u = laneU[1];
    scoreEl.textContent = '000';
  }

  function startGame(){
    resetGame();
    state = 'playing';
    overlay.style.display = 'none';
  }

  function endGame(){
    state = 'over';
    shake = 14;
    flash = 1;
    const s = Math.floor(distance/10);
    if (s > best){ best = s; bestEl.textContent = 'MELHOR ' + String(best).padStart(3,'0'); }
    overlay.querySelector('.big').textContent = 'Batida! Pontos: ' + s;
    overlay.querySelector('.small').textContent = 'toque para tentar de novo';
    overlay.style.display = 'flex';
  }

  function steer(dir){
    if (state === 'ready' || state === 'over'){ startGame(); return; }
    if (state !== 'playing') return;
    player.lane = clamp(player.lane + dir, 0, 2);
  }

  function handlePointer(clientX){
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    if (state !== 'playing'){ startGame(); return; }
    steer(x < rect.width/2 ? -1 : 1);
  }

  canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); handlePointer(e.touches[0].clientX); }, {passive:false});
  canvas.addEventListener('mousedown', (e)=> handlePointer(e.clientX));
  overlay.addEventListener('touchstart', (e)=>{ e.preventDefault(); if (state!=='playing') startGame(); }, {passive:false});
  overlay.addEventListener('mousedown', ()=>{ if (state!=='playing') startGame(); });
  document.addEventListener('keydown', (e)=>{
    if (e.code === 'ArrowLeft'){ e.preventDefault(); steer(-1); }
    if (e.code === 'ArrowRight'){ e.preventDefault(); steer(1); }
    if (e.code === 'Space' && state !== 'playing'){ e.preventDefault(); startGame(); }
  });

  function spawnEnemy(){
    const lane = Math.floor(Math.random()*3);
    const tooClose = enemies.some(en => en.lane === lane && en.y < horizonY + 60);
    if (tooClose) return;
    const palette = ['#ff4da6', '#ffb454', '#b18aff', '#7dffa0'];
    enemies.push({
      lane,
      y: horizonY + 2,
      color: palette[Math.floor(Math.random()*palette.length)]
    });
  }

  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function carBox(x, y, scale){
    const w = 30*scale, h = 48*scale;
    return {x: x-w/2, y: y-h/2, w, h};
  }

  function update(){
    frame++;
    distance += 3 + enemySpeedBase;
    enemySpeedBase = 2.6 + distance/1600;

    player.u = lerp(player.u, laneU[player.lane], 0.22);

    spawnTimer++;
    if (spawnTimer > nextSpawn){
      spawnEnemy();
      spawnTimer = 0;
      nextSpawn = Math.max(26, 55 - distance/260) + Math.random()*22;
    }

    enemies.forEach(en=>{
      const t = tAt(en.y);
      en.y += enemySpeedBase * (0.35 + 1.1*t);
    });
    enemies = enemies.filter(en => en.y < bottomY + 50);

    const px = projectX(player.u, player.y);
    const pScale = scaleAt(player.y);
    const pBox = carBox(px, player.y, pScale*0.85);

    for (const en of enemies){
      const ex = projectX(laneU[en.lane], en.y);
      const eScale = scaleAt(en.y);
      const eBox = carBox(ex, en.y, eScale*0.85);
      if (rectsOverlap(pBox, eBox)){ endGame(); break; }
    }

    if (frame % 3 === 0){
      particles.push({x: px + (Math.random()-0.5)*10, y: player.y+18, life:16, vx:(Math.random()-0.5)*0.6, vy: 1.4});
    }
    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.life--; });
    particles = particles.filter(p=>p.life>0);

    if (shake>0) shake -= 0.8;
    if (flash>0) flash -= 0.06;

    const s = Math.floor(distance/10);
    scoreEl.textContent = String(s).padStart(3,'0');
  }

  function drawSky(){
    const g = ctx.createLinearGradient(0,0,0,horizonY+10);
    g.addColorStop(0, '#050308');
    g.addColorStop(1, '#170a26');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,horizonY+10);

    stars.forEach(st=>{
      const a = 0.35 + Math.sin(frame*0.03 + st.tw)*0.3;
      ctx.fillStyle = `rgba(200,230,255,${Math.max(0,a)})`;
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill();
    });

    const off = (distance*0.3) % (W+60);
    buildings.forEach((b,i)=>{
      const x = ((b.x - off) % (W+60) + (W+60)) % (W+60) - 30;
      ctx.fillStyle = 'rgba(20,12,36,0.9)';
      ctx.fillRect(x, horizonY - b.h, b.w, b.h);
      if (b.lit){
        ctx.fillStyle = 'rgba(255,196,120,0.55)';
        ctx.fillRect(x+b.w*0.3, horizonY-b.h+6, 2, 2);
        ctx.fillRect(x+b.w*0.6, horizonY-b.h+14, 2, 2);
      }
    });
  }

  function drawRoad(){
    ctx.beginPath();
    ctx.moveTo(projectX(-1, horizonY), horizonY);
    ctx.lineTo(projectX(1, horizonY), horizonY);
    ctx.lineTo(projectX(1, bottomY), bottomY);
    ctx.lineTo(projectX(-1, bottomY), bottomY);
    ctx.closePath();
    ctx.fillStyle = '#17131f';
    ctx.fill();

    // ground either side
    ctx.fillStyle = '#0a0812';
    ctx.fillRect(0, horizonY, W, bottomY-horizonY);
    ctx.globalCompositeOperation = 'destination-over';
    ctx.globalCompositeOperation = 'source-over';

    drawEdge(-1, '#ffcf6b');
    drawEdge(1, '#ffcf6b');
    drawDashLine(-1/3);
    drawDashLine(1/3);
  }

  function drawEdge(u, color){
    const steps = 22;
    const scrollT = (distance*0.02) % 1;
    for (let i=0;i<steps;i++){
      const f = (i/steps + scrollT) % 1;
      if (Math.floor(f*steps)%2!==0) continue;
      const y0 = horizonY + f*(bottomY-horizonY);
      const y1 = horizonY + Math.min(f+1/steps,1)*(bottomY-horizonY);
      const x0 = projectX(u, y0), x1 = projectX(u, y1);
      const w = lerp(1.5,5, tAt(y0));
      ctx.strokeStyle = color;
      ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    }
  }

  function drawDashLine(u){
    const steps = 26;
    const scrollT = (distance*0.025) % 1;
    for (let i=0;i<steps;i++){
      const f = (i/steps + scrollT) % 1;
      if (Math.floor(f*steps)%2!==0) continue;
      const y0 = horizonY + f*(bottomY-horizonY);
      const y1 = horizonY + Math.min(f+0.6/steps,1)*(bottomY-horizonY);
      const x0 = projectX(u, y0), x1 = projectX(u, y1);
      ctx.strokeStyle = 'rgba(230,250,255,0.85)';
      ctx.lineWidth = lerp(1,3.4, tAt(y0));
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    }
  }

  function drawCar(x, y, scale, color, isPlayer){
    const w = 30*scale, h = 48*scale;
    ctx.save();
    ctx.translate(x,y);

    if (isPlayer){
      const beam = ctx.createLinearGradient(0,-h/2,0,-h/2-70*scale);
      beam.addColorStop(0, 'rgba(255,240,190,0.35)');
      beam.addColorStop(1, 'rgba(255,240,190,0)');
      ctx.fillStyle = beam;
      ctx.beginPath();
      ctx.moveTo(-w*0.3,-h/2);
      ctx.lineTo(w*0.3,-h/2);
      ctx.lineTo(w*0.9,-h/2-70*scale);
      ctx.lineTo(-w*0.9,-h/2-70*scale);
      ctx.closePath(); ctx.fill();
    }

    ctx.shadowColor = color;
    ctx.shadowBlur = 10*scale;
    ctx.fillStyle = '#0c0c14';
    ctx.beginPath();
    ctx.roundRect(-w/2, -h/2, w, h, 6*scale);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2*scale;
    ctx.beginPath();
    ctx.roundRect(-w/2, -h/2, w, h, 6*scale);
    ctx.stroke();

    ctx.fillStyle = color;
    ctx.globalAlpha = 0.5;
    ctx.fillRect(-w/2+3*scale, -h/2+6*scale, w-6*scale, h*0.35);
    ctx.globalAlpha = 1;

    if (isPlayer){
      ctx.fillStyle = '#fff4d0';
      ctx.fillRect(-w/2+2*scale, -h/2-1, 5*scale, 3*scale);
      ctx.fillRect(w/2-7*scale, -h/2-1, 5*scale, 3*scale);
    } else {
      ctx.fillStyle = '#ff5b5b';
      ctx.fillRect(-w/2+2*scale, -h/2-1, 5*scale, 3*scale);
      ctx.fillRect(w/2-7*scale, -h/2-1, 5*scale, 3*scale);
    }

    ctx.restore();
  }

  function render(){
    ctx.save();
    if (shake>0){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }
    ctx.clearRect(-20,-20,W+40,H+40);
    drawSky();
    drawRoad();

    particles.forEach(p=>{
      ctx.fillStyle = `rgba(150,200,255,${Math.max(0,p.life/16*0.4)})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,1.6,0,Math.PI*2); ctx.fill();
    });

    const drawList = enemies.map(en=>({
      x: projectX(laneU[en.lane], en.y), y: en.y, scale: scaleAt(en.y), color: en.color
    }));
    drawList.sort((a,b)=>a.y-b.y);
    drawList.forEach(c=> drawCar(c.x, c.y, c.scale, c.color, false));

    const px = projectX(player.u, player.y);
    drawCar(px, player.y, scaleAt(player.y), player.color, true);

    if (flash>0){
      ctx.fillStyle = `rgba(255,60,60,${flash*0.35})`;
      ctx.fillRect(0,0,W,H);
    }
    ctx.restore();
  }

  function loop(){
    if (state === 'playing') update();
    render();
    requestAnimationFrame(loop);
  }

  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
