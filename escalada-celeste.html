<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Escalada Celeste</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body {
    height:100%;
    background: #0a0e1a;
    overflow:hidden;
    touch-action: none;
  }
  body {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #wrap {
    width:100%;
    max-width:400px;
    padding:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  h1 {
    color:#e0e4ff;
    font-size:14px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:600;
    opacity:0.85;
  }
  #stage {
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(165,180,252,0.2), 0 20px 60px -20px rgba(0,0,0,0.85);
  }
  canvas {
    display:block;
    width:100%;
    height:auto;
    background:#0a0e1a;
  }
  #hud {
    position:absolute;
    top:10px;
    left:0; right:0;
    display:flex;
    justify-content:space-between;
    padding:0 14px;
    font-family:'Courier New', monospace;
    font-weight:700;
    font-size:14px;
    color:#eef0ff;
    text-shadow:0 0 8px rgba(165,180,252,0.55);
    pointer-events:none;
  }
  #overlay {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:rgba(10,14,26,0.5);
    color:#f0f1ff;
    text-align:center;
    padding:24px;
  }
  #overlay .big { font-size:18px; font-weight:700; letter-spacing:0.03em; }
  #overlay .small { font-size:12px; opacity:0.75; font-family:'Courier New', monospace; max-width:270px; }
  #hint { color:#454a5e; font-size:12px; letter-spacing:0.04em; text-align:center; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Escalada Celeste</h1>
  <div id="stage">
    <canvas id="game" width="360" height="520"></canvas>
    <div id="hud">
      <span id="score">000</span>
      <span id="best">MELHOR 000</span>
    </div>
    <div id="overlay">
      <div class="big">Escalada Celeste</div>
      <div class="small">arraste para os lados para se alinhar com a próxima plataforma — o pulo é automático</div>
    </div>
  </div>
  <div id="hint">arraste horizontalmente · setas/WASD no computador</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');

  const GRAVITY = 0.32;
  const BOUNCE_V = -11.6;
  const CHAR_R = 13;
  const TARGET_SCREEN_Y = H*0.42;

  let best = 0;
  let gameState = 'start'; // start | playing | over
  let frame = 0;
  let shake = 0, flash = 0;

  let char, camera, platforms, particles, bestY, startY;
  let targetX;

  const clouds = [];
  for (let i=0;i<10;i++){
    clouds.push({ y: Math.random()*4000, x:Math.random()*W, w:40+Math.random()*50, speed:0.15+Math.random()*0.15 });
  }
  const stars = [];
  for (let i=0;i<70;i++){
    stars.push({ y: Math.random()*6000-1000, x:Math.random()*W, r:Math.random()*1.3+0.3, tw:Math.random()*Math.PI*2 });
  }

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function pad(n){ return String(n).padStart(3,'0'); }
  function screenY(worldY){ return worldY - camera.offset; }

  function makePlatform(x,y,type){
    return {
      x, y, w: type==='moving' ? 56 : 62, h:12, type,
      dir: Math.random()<0.5?1:-1, vx: 0.6+Math.random()*0.6,
      crumble: 0, dead:false
    };
  }

  function resetGame(){
    startY = H-60;
    char = { x:W/2, y:startY-20, vy:0, squash:1 };
    camera = { offset: startY-(H-40), target: startY-(H-40) };
    bestY = char.y;
    targetX = W/2;
    platforms = [];
    particles = [];
    frame = 0;

    platforms.push(makePlatform(W/2-31, startY, 'static'));
    let y = startY;
    while (y > startY-1600){
      y -= 80+Math.random()*60;
      const x = 20+Math.random()*(W-40-62);
      platforms.push(makePlatform(x,y,'static'));
    }
    topSpawnedY = y;
    scoreEl.textContent = '000';
  }
  let topSpawnedY = 0;

  function startGame(){
    resetGame();
    gameState='playing';
    overlay.style.display='none';
  }

  function endGame(){
    gameState='over';
    shake=12; flash=0.7;
    const score = currentScore();
    if (score>best){ best=score; bestEl.textContent='MELHOR '+pad(best); }
    overlay.querySelector('.big').textContent = 'Você caiu!';
    overlay.querySelector('.small').textContent = 'altura alcançada: '+score+' · toque para tentar de novo';
    overlay.style.display='flex';
  }

  function currentScore(){
    return Math.max(0, Math.floor((startY-bestY)/8));
  }

  overlay.addEventListener('touchstart', e=>{ e.preventDefault(); tapStart(); }, {passive:false});
  overlay.addEventListener('mousedown', tapStart);
  function tapStart(){ if (gameState==='start'||gameState==='over') startGame(); }

  function canvasX(clientX){
    const rect = canvas.getBoundingClientRect();
    return clamp((clientX-rect.left)/rect.width*W, CHAR_R, W-CHAR_R);
  }
  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); targetX = canvasX(e.touches[0].clientX); }, {passive:false});
  canvas.addEventListener('touchmove', e=>{ e.preventDefault(); targetX = canvasX(e.touches[0].clientX); }, {passive:false});
  canvas.addEventListener('mousemove', e=>{ targetX = canvasX(e.clientX); });
  canvas.addEventListener('mousedown', e=>{ targetX = canvasX(e.clientX); });

  const keys = new Set();
  document.addEventListener('keydown', e=>{
    if (['ArrowLeft','ArrowRight'].includes(e.code)||['a','d'].includes(e.key.toLowerCase())) e.preventDefault();
    keys.add(e.code);
  });
  document.addEventListener('keyup', e=> keys.delete(e.code));

  function spawnBurst(x,y,color,n){
    for (let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=0.8+Math.random()*2;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:20,color});
    }
  }

  function maybeSpawnMore(){
    while (topSpawnedY > camera.target - H*1.6){
      const score = currentScore();
      const gap = 78+Math.random()*60;
      topSpawnedY -= gap;
      const w = score>60 ? 48 : 62;
      const x = 16+Math.random()*(W-32-w);
      let type = 'static';
      const r = Math.random();
      if (score>40 && r<0.16) type='crumble';
      else if (score>15 && r<0.4) type='moving';
      const p = makePlatform(x,topSpawnedY,type);
      p.w = w;
      platforms.push(p);
    }
  }

  function update(){
    frame++;
    if (keys.has('ArrowLeft')||keys.has('KeyA')) targetX = clamp(targetX-4.2, CHAR_R, W-CHAR_R);
    if (keys.has('ArrowRight')||keys.has('KeyD')) targetX = clamp(targetX+4.2, CHAR_R, W-CHAR_R);

    char.x = lerp(char.x, targetX, 0.22);
    char.vy += GRAVITY;
    char.y += char.vy;
    char.squash = clamp(1 - char.vy*0.012, 0.75, 1.25);

    if (char.y < bestY) bestY = char.y;
    const score = currentScore();
    scoreEl.textContent = pad(score);

    camera.target = Math.min(camera.target, bestY-TARGET_SCREEN_Y);
    camera.offset = lerp(camera.offset, camera.target, 0.1);

    platforms.forEach(p=>{
      if (p.type==='moving' && p.crumble<=0){
        p.x += p.dir*p.vx;
        if (p.x<10){ p.x=10; p.dir=1; }
        if (p.x+p.w>W-10){ p.x=W-10-p.w; p.dir=-1; }
      }
      if (p.crumble>0){
        p.crumble--;
        if (p.crumble<=0) p.dead = true;
      }
    });

    if (char.vy>0){
      for (const p of platforms){
        if (p.dead || p.crumble>0) continue;
        const px1=p.x, px2=p.x+p.w, py=p.y;
        if (char.x+CHAR_R*0.7>px1 && char.x-CHAR_R*0.7<px2){
          const prevBottom = char.y - char.vy + CHAR_R*0.6;
          const nowBottom = char.y + CHAR_R*0.6;
          if (prevBottom<=py && nowBottom>=py){
            char.vy = BOUNCE_V;
            char.y = py - CHAR_R*0.6;
            spawnBurst(char.x, py, '224,231,255', 8);
            if (p.type==='crumble') p.crumble = 14;
            break;
          }
        }
      }
    }

    maybeSpawnMore();
    platforms = platforms.filter(p=> !p.dead && screenY(p.y) < H+60);

    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--; });
    particles = particles.filter(p=>p.life>0);

    if (screenY(char.y) > H+30) endGame();

    if (shake>0) shake-=0.6;
    if (flash>0) flash-=0.05;
  }

  function drawBackground(){
    const t = clamp(currentScore()/220, 0, 1);
    const topA = [10,14,26], topB=[5,6,14];
    const botA = [46,40,90], botB=[10,10,22];
    const top = topA.map((c,i)=>Math.round(lerp(c,topB[i],t)));
    const bot = botA.map((c,i)=>Math.round(lerp(c,botB[i],t)));
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, `rgb(${top.join(',')})`);
    g.addColorStop(1, `rgb(${bot.join(',')})`);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    stars.forEach(s=>{
      const sy = screenY(s.y - 3000);
      if (sy<-10||sy>H+10) return;
      const a = (0.2+Math.sin(frame*0.02+s.tw)*0.2) * clamp(t*1.4,0.15,1);
      ctx.fillStyle = `rgba(230,235,255,${Math.max(0,a)})`;
      ctx.beginPath(); ctx.arc(s.x,sy,s.r,0,Math.PI*2); ctx.fill();
    });

    clouds.forEach(c=>{
      const sy = screenY(c.y);
      if (sy<-40||sy>H+40) return;
      const a = 0.5*(1-t);
      if (a<=0.02) return;
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.beginPath();
      ctx.ellipse(c.x, sy, c.w*0.5, c.w*0.28, 0, 0, Math.PI*2);
      ctx.ellipse(c.x-c.w*0.3, sy+3, c.w*0.32, c.w*0.2, 0, 0, Math.PI*2);
      ctx.ellipse(c.x+c.w*0.3, sy+3, c.w*0.32, c.w*0.2, 0, 0, Math.PI*2);
      ctx.fill();
    });
  }

  function drawPlatform(p){
    const sy = screenY(p.y);
    if (sy<-20||sy>H+20) return;
    const colors = { static:'#e0e7ff', moving:'#67e8f9', crumble:'#fbbf24' };
    ctx.save();
    if (p.crumble>0) ctx.globalAlpha = clamp(p.crumble/14,0,1);
    ctx.shadowColor = colors[p.type];
    ctx.shadowBlur = 7;
    ctx.fillStyle = colors[p.type];
    ctx.beginPath();
    ctx.roundRect(p.x, sy, p.w, p.h, 5);
    ctx.fill();
    ctx.restore();
  }

  function drawChar(){
    const sy = screenY(char.y);
    ctx.save();
    ctx.translate(char.x, sy);
    ctx.scale(1/char.squash, char.squash);
    ctx.shadowColor = 'rgba(165,180,252,0.7)';
    ctx.shadowBlur = 9;
    ctx.fillStyle = '#12172b';
    ctx.beginPath();
    ctx.arc(0,0,CHAR_R,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#a5b4fc';
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.fillStyle = '#eef0ff';
    ctx.beginPath(); ctx.arc(-3,-2,1.8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-2,1.8,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function render(){
    ctx.save();
    if (shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    ctx.clearRect(-20,-20,W+40,H+40);
    drawBackground();
    platforms.forEach(drawPlatform);
    particles.forEach(p=>{
      const psy = screenY(p.y);
      if (psy<-10||psy>H+10) return;
      ctx.fillStyle = `rgba(${p.color},${Math.max(0,p.life/20)})`;
      ctx.beginPath(); ctx.arc(p.x, psy, 2,0,Math.PI*2); ctx.fill();
    });
    drawChar();
    if (flash>0){
      ctx.fillStyle = `rgba(255,90,90,${flash*0.3})`;
      ctx.fillRect(0,0,W,H);
    }
    ctx.restore();
  }

  function loop(){
    if (gameState==='playing') update();
    render();
    requestAnimationFrame(loop);
  }

  resetGame();
  render();
  loop();
})();
</script>
</body>
</html>
